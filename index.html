<script>
  // 1. Helper to get the correct Font Awesome icon class
  function getIconClass(type) {
    // Clean up type to ensure it matches common keys
    const cleanType = type ? type.toLowerCase().trim() : "link";

    switch (cleanType) {
      // Social Media
      case "instagram":
        return "fab fa-instagram";
      case "facebook":
        return "fab fa-facebook-f";
      case "whatsapp":
        return "fab fa-whatsapp";
      case "tiktok":
        return "fab fa-tiktok";
      case "twitter":
        return "fab fa-twitter";
      case "linkedin":
        return "fab fa-linkedin-in";
      case "snapchat":
        return "fab fa-snapchat-ghost";
      case "youtube":
        return "fab fa-youtube";
      case "viber":
        return "fab fa-viber";
      case "telegram":
        return "fab fa-telegram-plane";
      // Contact & Functional
      case "email":
        return "fas fa-envelope";
      case "phone":
        return "fas fa-phone-alt";
      case "address":
        return "fas fa-map-marker-alt";
      case "menu":
        return "fas fa-utensils"; // Fork and Knife icon
      case "gallery":
        return "fas fa-images";
      case "website":
        return "fas fa-globe";
      case "web":
        return "fas fa-globe";
      default:
        return "fas fa-link"; // Default link icon
    }
  }

  // 2. Helper to get gradient
  function getGradient(color) {
    if (!color) return "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
    // If it's already a gradient string, return it
    if (color.includes("gradient")) return color;

    // If it's a hex code, make a gradient
    const hex = color.replace("#", "");
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    const brightness = (r * 299 + g * 587 + b * 114) / 1000;

    if (brightness > 180) {
      // If light color, darken the second stop
      return `linear-gradient(135deg, ${color} 0%, #000000 100%)`;
    }
    // If dark color, just use it or slightly vary it
    return `linear-gradient(135deg, ${color} 0%, ${color} 100%)`;
  }

  // 3. Helper for subtitles
  function getSubtitleForType(defaultSubtitle, type) {
    switch (type) {
      case "phone":
        return "Appelez-nous";
      case "address":
        return "Obtenir les directions";
      case "menu":
        return "Découvrez nos offres";
      case "gallery":
        return "Voir notre portfolio";
      case "email":
        return "Envoyez-nous un message";
      case "website":
        return "Visitez notre site";
      case "instagram":
        return "Suivez-nous";
      case "viber":
        return "Discutez sur Viber";
      case "telegram":
        return "Rejoignez-nous";
      default:
        return "Visiter le lien";
    }
  }

  // DOM elements
  const mainContainer = document.getElementById("mainContainer");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalIframe = document.getElementById("modalIframe");
  // FIX: Use querySelector because your HTML uses class="modal-title", not id
  const modalTitle = document.querySelector(".modal-title");
  const modalClose = document.getElementById("modalClose");

  const galleryModal = document.getElementById("galleryModal");
  const carouselImage = document.getElementById("carouselImage");
  const prevImage = document.getElementById("prevImage");
  const nextImage = document.getElementById("nextImage");
  const galleryClose = document.getElementById("galleryClose");

  let currentImageIndex = 0;
  let galleryImages = [];

  // Core function to load and render the business card
  async function loadBusiness() {
    // Fix: Get ID from URL path (e.g., /omyga-gym -> omyga-gym)
    let path = window.location.pathname.replace(/^\/+|\/+$/g, "");

    // Default to 'los-tacos' if path is empty or index.html
    if (path === "" || path === "index.html" || path === "_redirects") {
      path = "los-tacos";
    }

    const businessKey = path;

    let businessesData;
    try {
      // FIX: Added '/' at the start to force absolute path from root
      // Added timestamp to prevent caching issues
      const response = await fetch(
        `/businesses.json?t=${new Date().getTime()}`
      );

      // Check if we accidentally got the HTML page instead of JSON (common SPA error)
      const contentType = response.headers.get("content-type");
      if (contentType && contentType.indexOf("application/json") === -1) {
        throw new Error("Received HTML instead of JSON");
      }

      if (!response.ok) throw new Error("HTTP error " + response.status);
      businessesData = await response.json();
    } catch (error) {
      console.error("Could not load business data:", error);
      mainContainer.innerHTML =
        '<div class="error-state"><h2>Erreur</h2><p>Impossible de charger les données.</p></div>';
      return;
    }

    const data = businessesData[businessKey];
    if (!data) {
      mainContainer.innerHTML = `<div class="error-state"><h2>Erreur</h2><p>Entreprise "${businessKey}" introuvable.</p></div>`;
      return;
    }

    const {
      name,
      image,
      address,
      phone,
      email,
      gradient,
      menu,
      socials,
      gallery,
    } = data;

    // --- Build the links array ---
    const links = [];

    // Email Link
    if (email) {
      // Fix typo in specific email if present
      let cleanEmail = email.trim();
      if (cleanEmail.endsWith("coma")) cleanEmail = cleanEmail.slice(0, -1);

      links.push({
        type: "email",
        title: "Email",
        subtitle: cleanEmail,
        url: `mailto:${cleanEmail}`,
        external: true,
      });
    }

    // Address Link
    if (address) {
      let addrUrl = typeof address === "string" ? address : address.url;
      // If it's just text or empty URL, generate a Google Maps search link
      if (!addrUrl || addrUrl.length < 5) {
        addrUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          address.text || address
        )}`;
      }

      links.push({
        type: "address",
        title:
          (typeof address === "object" ? address.text : address) ||
          "Notre Adresse",
        subtitle: getSubtitleForType("", "address"),
        url: addrUrl,
        external: true,
      });
    }

    // Phone Link
    if (phone) {
      // Clean phone number for tel: link (remove spaces/dashes)
      const cleanPhone = phone.replace(/[^+\d]/g, "");
      links.push({
        type: "phone",
        title: phone,
        subtitle: getSubtitleForType("", "phone"),
        url: `tel:${cleanPhone}`,
        external: true,
      });
    }

    // Menu Link
    if (menu) {
      // Use Google Docs Viewer for PDFs
      const googleViewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(
        menu
      )}&embedded=true`;
      links.push({
        type: "menu",
        title: "Voir le Menu",
        subtitle: getSubtitleForType("", "menu"),
        url: googleViewerUrl,
        external: false,
        modal: true,
      });
    }

    // Gallery Link (Button)
    if (gallery && gallery.images && gallery.images.length > 0) {
      links.push({
        type: "gallery",
        title: gallery.name || "Galerie Photos",
        subtitle: getSubtitleForType("", "gallery"),
        external: false,
        modal: true,
      });
      galleryImages = gallery.images;
    }

    // Social Links
    Object.entries(socials || {}).forEach(([platform, url]) => {
      if (!url) return;

      let finalUrl = url;
      // Fix specific protocol handlers if needed
      if (
        platform === "viber" &&
        !url.startsWith("viber://") &&
        !url.startsWith("http")
      ) {
        const viberNum = url.replace(/[^+\d]/g, "");
        finalUrl = `viber://chat?number=${viberNum}`;
      }
      if (platform === "telegram" && !url.startsWith("https://")) {
        const username = url.replace("@", "");
        finalUrl = `https://t.me/${username}`;
      }

      links.push({
        type: platform,
        title: platform.charAt(0).toUpperCase() + platform.slice(1),
        subtitle: getSubtitleForType("", platform),
        url: finalUrl,
        external: true,
      });
    });

    // --- Render HTML ---
    const linksHtml = links
      .map((link, index) => {
        // Special handling for Gallery
        if (link.type === "gallery") {
          return `
                        <a href="#" class="link-item gallery" id="galleryLink" style="animation-delay: ${
                          0.1 + index * 0.1
                        }s">
                            <div class="link-icon">
                                <i class="${getIconClass("gallery")}"></i>
                            </div>
                            <div class="link-content">
                                <div class="link-title">${link.title}</div>
                                <div class="link-subtitle">${
                                  link.subtitle
                                }</div>
                            </div>
                            <div class="link-arrow">
                                <i class="fas fa-chevron-right"></i>
                            </div>
                        </a>
                    `;
        }

        // Standard Links
        const linkTarget = link.external
          ? 'target="_blank" rel="noopener noreferrer"'
          : "";
        const modalAttribute =
          link.modal && link.type === "menu"
            ? `data-modal-url="${link.url}"`
            : "";

        return `
                    <a href="${link.url}" 
                       class="link-item ${link.type}" 
                       ${linkTarget} 
                       ${modalAttribute} 
                       data-title="${link.title}"
                       style="animation-delay: ${0.1 + index * 0.1}s">
                        <div class="link-icon">
                            <i class="${getIconClass(link.type)}"></i>
                        </div>
                        <div class="link-content">
                            <div class="link-title">${link.title}</div>
                            <div class="link-subtitle">${link.subtitle}</div>
                        </div>
                        <div class="link-arrow">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </a>
                `;
      })
      .join("");

    // Header Image check
    const isMapImage = image && image.includes("maps.google");
    const imgSrc =
      isMapImage || !image
        ? `https://ui-avatars.com/api/?name=${encodeURIComponent(
            name
          )}&background=random&size=140`
        : image;

    const contentHtml = `
                <div class="profile-header">
                    <img src="${imgSrc}" alt="${name}" class="profile-avatar" onerror="this.src='https://via.placeholder.com/140'">
                    <h1 class="profile-name">${name}</h1>
                    <p class="profile-bio">Bienvenue sur notre profil</p>
                </div>
                <div class="links-container">
                    ${linksHtml}
                </div>
            `;

    document.getElementById("mainContainer").innerHTML = contentHtml;
    document.title = name;
    document.body.style.background = getGradient(gradient);

    // --- Attach Event Listeners ---

    // 1. Menu Modal Listeners
    document.querySelectorAll(".link-item[data-modal-url]").forEach((item) => {
      item.addEventListener("click", function (e) {
        e.preventDefault();
        const url = this.getAttribute("data-modal-url");
        const title = this.getAttribute("data-title");
        openModal(url, title);
      });
    });

    // 2. Gallery Listener
    const galLink = document.getElementById("galleryLink");
    if (galLink) {
      galLink.addEventListener("click", function (e) {
        e.preventDefault();
        openGallery();
      });
    }
  }

  // --- Modal Functions ---

  function openModal(url, title) {
    if (modalTitle) modalTitle.textContent = title;
    if (modalIframe) modalIframe.src = url;
    if (modalOverlay) modalOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    if (modalOverlay) modalOverlay.classList.remove("active");
    if (modalIframe) modalIframe.src = "";
    document.body.style.overflow = "";
  }

  // Gallery Functions
  function openGallery() {
    if (!galleryImages || galleryImages.length === 0) return;
    currentImageIndex = 0;
    updateGalleryImage();
    if (galleryModal) galleryModal.style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closeGallery() {
    if (galleryModal) galleryModal.style.display = "none";
    if (carouselImage) carouselImage.src = "";
    document.body.style.overflow = "";
  }

  function updateGalleryImage() {
    if (carouselImage) carouselImage.src = galleryImages[currentImageIndex];

    // Toggle arrows
    if (prevImage)
      prevImage.style.display = galleryImages.length > 1 ? "block" : "none";
    if (nextImage)
      nextImage.style.display = galleryImages.length > 1 ? "block" : "none";
  }

  // --- Global Event Listeners ---

  // Modal Close (X button & Overlay click)
  if (modalClose) modalClose.addEventListener("click", closeModal);
  if (modalOverlay)
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

  // Gallery Close (X button & Overlay click)
  if (galleryClose) galleryClose.addEventListener("click", closeGallery);
  if (galleryModal)
    galleryModal.addEventListener("click", (e) => {
      if (e.target === galleryModal) closeGallery(); // Close if clicking background
    });

  // Gallery Navigation
  if (prevImage)
    prevImage.addEventListener("click", (e) => {
      e.stopPropagation(); // Prevent closing modal
      currentImageIndex =
        (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
      updateGalleryImage();
    });
  if (nextImage)
    nextImage.addEventListener("click", (e) => {
      e.stopPropagation(); // Prevent closing modal
      currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
      updateGalleryImage();
    });

  // Keyboard support (Escape key)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (modalOverlay && modalOverlay.classList.contains("active"))
        closeModal();
      if (galleryModal && galleryModal.style.display === "flex") closeGallery();
    }
  });

  // Start
  document.addEventListener("DOMContentLoaded", loadBusiness);
</script>
