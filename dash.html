<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Manager | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .social-input {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e2e8f0;
        padding: 8px;
        border-radius: 12px;
        transition: all 0.2s;
      }
      .social-input:focus-within {
        border-color: #4f46e5;
        ring: 2px;
        ring-color: #4f46e5;
      }
      .social-input i {
        width: 24px;
        text-align: center;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm">
        <h2
          class="text-3xl font-black mb-6 text-slate-800 text-center tracking-tight"
        >
          Admin Login
        </h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-400 mb-1"
              >Supabase URL</label
            >
            <input
              type="text"
              id="supabaseUrl"
              class="w-full p-3 border rounded-xl"
              placeholder="https://xxx.supabase.co"
            />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-400 mb-1"
              >Service Role Key</label
            >
            <input
              type="password"
              id="supabaseKey"
              class="w-full p-3 border rounded-xl"
              placeholder="secret-key"
            />
          </div>
          <button
            onclick="authenticate()"
            id="btnAuth"
            class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200"
          >
            Connect Dashboard
          </button>
        </div>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-10">
      <div
        class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6"
      >
        <div>
          <h1 class="text-4xl font-black text-slate-900 tracking-tighter">
            Business Console
          </h1>
          <p class="text-slate-500 font-medium">
            Manage your NFC business cards and clients.
          </p>
        </div>
        <div class="flex gap-3">
          <button
            onclick="loadData()"
            class="bg-white border border-slate-200 px-6 py-3 rounded-2xl font-bold text-slate-600 hover:bg-slate-50 transition"
          >
            <i class="fas fa-sync mr-2"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100"
          >
            <i class="fas fa-plus mr-2"></i> Add Business
          </button>
          <button
            onclick="logout()"
            class="text-red-400 hover:text-red-600 px-2 transition"
          >
            <i class="fas fa-power-off text-xl"></i>
          </button>
        </div>
      </div>

      <div class="mb-10">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search businesses..."
          class="w-full p-5 border-none rounded-3xl shadow-sm focus:ring-4 focus:ring-indigo-100 outline-none text-lg"
        />
      </div>

      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      ></div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-4xl m-4 p-10 relative"
      >
        <div class="flex justify-between items-center mb-8">
          <h2
            id="modalTitle"
            class="text-3xl font-black text-slate-800 tracking-tight"
          >
            Business Setup
          </h2>
          <button
            onclick="closeEditModal()"
            class="text-slate-300 hover:text-slate-600 text-4xl"
          >
            &times;
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
          <div class="space-y-6">
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-2"
                >Business Logo</label
              >
              <div
                class="relative group cursor-pointer border-2 border-dashed border-slate-200 rounded-3xl p-4 text-center hover:border-indigo-400 transition"
                onclick="document.getElementById('fileInput').click()"
              >
                <img
                  id="imagePreview"
                  src="https://via.placeholder.com/150"
                  class="w-32 h-32 rounded-full mx-auto object-cover mb-3 shadow-md"
                />
                <p class="text-[10px] font-bold text-indigo-500 uppercase">
                  Click to Upload
                </p>
                <input
                  type="file"
                  id="fileInput"
                  class="hidden"
                  accept="image/*"
                  onchange="previewImage(this)"
                />
                <input type="hidden" id="editImage" />
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Background Gradient</label
              >
              <div class="flex gap-2">
                <input
                  type="text"
                  id="editGradient"
                  class="flex-1 p-3 border rounded-xl text-sm font-mono"
                  placeholder="linear-gradient(...)"
                />
                <input
                  type="color"
                  onchange="
                    document.getElementById('editGradient').value =
                      `linear-gradient(135deg, ${this.value} 0%, #1a1a1a 100%)`
                  "
                  class="w-12 h-12 rounded-xl border-none cursor-pointer"
                />
              </div>
            </div>
          </div>

          <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Unique ID (URL Slug)</label
              >
              <input
                type="text"
                id="editId"
                class="w-full p-3 border rounded-xl font-bold text-indigo-600"
                placeholder="e.g. burger-king"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Business Name</label
              >
              <input
                type="text"
                id="editName"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Phone Number</label
              >
              <input
                type="text"
                id="editPhone"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Contact Email</label
              >
              <input
                type="email"
                id="editEmail"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Access Code</label
              >
              <input
                type="text"
                id="displayCode"
                readonly
                class="w-full p-3 border rounded-xl bg-slate-50 font-mono text-indigo-500"
                value="AUTO-GEN"
              />
            </div>

            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Address Text</label
              >
              <input
                type="text"
                id="editAddrText"
                class="w-full p-3 border rounded-xl"
                placeholder="123 Street Name, City"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Google Maps URL</label
              >
              <input
                type="text"
                id="editAddrUrl"
                class="w-full p-3 border rounded-xl"
                placeholder="https://goo.gl/maps/..."
              />
            </div>
          </div>

          <div class="md:col-span-3 border-t pt-8 mt-4">
            <h3 class="font-black text-slate-800 text-lg mb-6 tracking-tight">
              Social Media & Links
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="social-input">
                <i class="fab fa-facebook text-blue-600"></i
                ><input
                  type="text"
                  id="socialFb"
                  placeholder="Facebook URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-instagram text-pink-600"></i
                ><input
                  type="text"
                  id="socialInsta"
                  placeholder="Instagram URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-tiktok text-black"></i
                ><input
                  type="text"
                  id="socialTiktok"
                  placeholder="TikTok URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-youtube text-red-600"></i
                ><input
                  type="text"
                  id="socialYoutube"
                  placeholder="YouTube URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fa-brands fa-threads text-black"></i
                ><input
                  type="text"
                  id="socialThreads"
                  placeholder="Threads URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-snapchat text-yellow-400"></i
                ><input
                  type="text"
                  id="socialSnapchat"
                  placeholder="Snapchat URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-telegram text-blue-400"></i
                ><input
                  type="text"
                  id="socialTelegram"
                  placeholder="Telegram URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-viber text-purple-600"></i
                ><input
                  type="text"
                  id="socialViber"
                  placeholder="Viber URL"
                  class="w-full outline-none text-sm"
                />
              </div>
              <div class="social-input">
                <i class="fas fa-globe text-slate-400"></i
                ><input
                  type="text"
                  id="socialWeb"
                  placeholder="Website"
                  class="w-full outline-none text-sm"
                />
              </div>
            </div>
          </div>
        </div>

        <div
          class="flex justify-end gap-4 mt-10 pt-8 border-t border-slate-100"
        >
          <button
            onclick="closeEditModal()"
            class="text-slate-400 font-bold px-6"
          >
            Cancel
          </button>
          <button
            onclick="saveBusiness()"
            id="saveBtn"
            class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition"
          >
            Save Business Card
          </button>
        </div>
      </div>
    </div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;

      // ... [authenticate and loadData functions same as before] ...

      async function saveBusiness() {
        const btn = document.getElementById("saveBtn");
        const id = document.getElementById("editId").value.trim().toLowerCase();
        const file = document.getElementById("fileInput").files[0];
        if (!id) return alert("ID is required");

        btn.disabled = true;
        btn.textContent = "Processing...";

        try {
          let imageUrl = document.getElementById("editImage").value;
          if (file) imageUrl = await uploadImage(file, id);

          const payload = {
            business_id: id,
            name: document.getElementById("editName").value,
            phone: document.getElementById("editPhone").value,
            email: document.getElementById("editEmail").value,
            gradient: document.getElementById("editGradient").value,
            image: imageUrl,
            // SAVING ADDRESS OBJECT
            address: {
              text: document.getElementById("editAddrText").value,
              url: document.getElementById("editAddrUrl").value,
            },
            socials: {
              facebook: document.getElementById("socialFb").value,
              instagram: document.getElementById("socialInsta").value,
              tiktok: document.getElementById("socialTiktok").value,
              youtube: document.getElementById("socialYoutube").value,
              threads: document.getElementById("socialThreads").value,
              snapchat: document.getElementById("socialSnapchat").value,
              telegram: document.getElementById("socialTelegram").value,
              viber: document.getElementById("socialViber").value,
              website: document.getElementById("socialWeb").value,
            },
          };

          const isNew = !currentEditId;
          await fetch(
            `${credentials.url}/rest/v1/businesses${isNew ? "" : "?business_id=eq." + id}`,
            {
              method: isNew ? "POST" : "PATCH",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify(payload),
            },
          );

          closeEditModal();
          loadData();
        } catch (e) {
          alert(e.message);
        }
        btn.disabled = false;
      }

      function openModal(mode, id = null) {
        currentEditId = id;
        document.getElementById("editModal").classList.remove("hidden");

        if (id) {
          const b = globalData[id];
          document.getElementById("editId").value = b.business_id;
          document.getElementById("editId").disabled = true;
          document.getElementById("editName").value = b.name || "";
          document.getElementById("editPhone").value = b.phone || "";
          document.getElementById("editEmail").value = b.email || "";
          document.getElementById("editGradient").value = b.gradient || "";
          document.getElementById("editImage").value = b.image || "";
          document.getElementById("imagePreview").src =
            b.image || "https://via.placeholder.com/150";

          // LOADING ADDRESS FIELDS
          document.getElementById("editAddrText").value = b.address?.text || "";
          document.getElementById("editAddrUrl").value = b.address?.url || "";

          const s = b.socials || {};
          document.getElementById("socialFb").value = s.facebook || "";
          document.getElementById("socialInsta").value = s.instagram || "";
          document.getElementById("socialTiktok").value = s.tiktok || "";
          document.getElementById("socialYoutube").value = s.youtube || "";
          document.getElementById("socialThreads").value = s.threads || "";
          document.getElementById("socialSnapchat").value = s.snapchat || "";
          document.getElementById("socialTelegram").value = s.telegram || "";
          document.getElementById("socialViber").value = s.viber || "";
          document.getElementById("socialWeb").value = s.website || "";
        } else {
          document.getElementById("editId").disabled = false;
          document
            .querySelectorAll("#editModal input")
            .forEach((i) => (i.type !== "file" ? (i.value = "") : null));
          document.getElementById("imagePreview").src =
            "https://via.placeholder.com/150";
        }
      }

      // ... [other helper functions] ...
    </script>
  </body>
</html>
