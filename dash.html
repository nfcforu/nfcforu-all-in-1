<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Business Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Dashboard Login</h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"
        ></div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Supabase URL</label>
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-2 border rounded"
            placeholder="https://xxxxx.supabase.co"
          />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Service Role Key</label>
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-2 border rounded"
            placeholder="eyJhbGc..."
          />
        </div>
        <button
          onclick="authenticate()"
          id="btnAuth"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          Connect
        </button>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Business Manager</h1>
        <div class="flex gap-2">
          <button
            onclick="loadData()"
            class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300"
          >
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
          >
            <i class="fas fa-plus"></i> Add New
          </button>
          <button
            onclick="logout()"
            class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
          >
            Logout
          </button>
        </div>
      </div>
      <div class="mb-6">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search businesses..."
          class="w-full p-3 border rounded-lg shadow-sm"
        />
      </div>
      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto py-10"
    ></div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };

      async function loadData() {
        showToast("Loading data...", true);
        try {
          // IMPORTANT: Join with business_access to get codes
          const response = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*,business_access(*)`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          const businesses = await response.json();
          globalData = {};
          businesses.forEach((biz) => {
            globalData[biz.business_id] = biz;
          });
          renderGrid();
          showToast("Data loaded successfully");
        } catch (e) {
          alert("Load error: " + e.message);
        }
      }

      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = "";
        Object.entries(globalData).forEach(([key, biz]) => {
          // Get the raw access code from the joined table data
          const accessCode =
            biz.business_access?.[0]?.access_code_raw || "Hashed";

          const card = document.createElement("div");
          card.className =
            "bg-white p-4 rounded-lg shadow border-t-4 border-blue-500 relative";
          card.innerHTML = `
            <div class="flex items-center gap-4 mb-4">
              <img src="${biz.image || "https://via.placeholder.com/150"}" class="w-16 h-16 rounded-full object-cover">
              <div>
                <h3 class="font-bold text-lg">${biz.name || "Unnamed"}</h3>
                <div class="flex gap-2 items-center">
                    <span class="text-xs font-mono bg-gray-100 px-2 py-1 rounded">${key}</span>
                    <span class="text-xs font-bold bg-green-100 text-green-700 px-2 py-1 rounded" title="Access Code">
                        <i class="fas fa-key"></i> ${accessCode}
                    </span>
                </div>
              </div>
            </div>
            <div class="mt-4 flex gap-2 border-t pt-3">
              <button onclick="editBusiness('${key}')" class="flex-1 bg-blue-50 text-blue-600 py-1 rounded">Edit</button>
              <button onclick="deleteBusiness('${key}')" class="flex-1 bg-red-50 text-red-600 py-1 rounded">Delete</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      async function generateAccessCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 8; i++)
          code += chars.charAt(Math.floor(Math.random() * chars.length));

        const encoder = new TextEncoder();
        const data = encoder.encode(code);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");

        return { raw: code, hash: hashHex };
      }

      async function saveBusiness() {
        // ... (Gather form data same as before) ...
        const id = document.getElementById("editId").value.trim().toLowerCase();
        const isNew = !currentEditId;

        try {
          // Save business info
          await fetch(
            `${credentials.url}/rest/v1/businesses${isNew ? "" : "?business_id=eq." + id}`,
            {
              method: isNew ? "POST" : "PATCH",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify(businessData),
            },
          );

          if (isNew) {
            const codes = await generateAccessCode();
            await fetch(`${credentials.url}/rest/v1/business_access`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify({
                business_id: id,
                access_code_hash: codes.hash,
                access_code_raw: codes.raw, // Save raw code for admin view
              }),
            });
            alert(`Business Created!\nAccess Code: ${codes.raw}`);
          }
          loadData();
          closeEditModal();
        } catch (e) {
          alert("Save failed: " + e.message);
        }
      }
      // ... (Rest of your helper functions: authenticate, logout, showToast, etc) ...
    </script>
  </body>
</html>
