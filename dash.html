<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Business Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Dashboard Login</h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"
        ></div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Supabase URL</label>
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-2 border rounded"
            placeholder="https://xxxxx.supabase.co"
          />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Service Role Key</label>
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-2 border rounded"
            placeholder="eyJhbGc..."
          />
        </div>
        <button
          onclick="authenticate()"
          id="btnAuth"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          Connect
        </button>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Business Manager</h1>
        <div class="flex gap-2">
          <button
            onclick="loadData()"
            class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300"
          >
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
          >
            <i class="fas fa-plus"></i> Add New
          </button>
          <button
            onclick="showMigrationModal()"
            class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700"
          >
            <i class="fas fa-database"></i> Migrate JSON
          </button>
          <button
            onclick="logout()"
            class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
          >
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
      <div class="mb-6">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search businesses..."
          class="w-full p-3 border rounded-lg shadow-sm"
        />
      </div>
      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <div
      id="migrationModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40"
    >
      <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl m-4 p-6">
        <h2 class="text-2xl font-bold mb-4">Migrate from JSON to Supabase</h2>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2"
            >Paste your businesses.json content:</label
          >
          <textarea
            id="jsonContent"
            rows="15"
            class="w-full p-3 border rounded font-mono text-sm"
            placeholder='{"business-id": {...}, ...}'
          ></textarea>
        </div>
        <div class="flex justify-end gap-3">
          <button
            onclick="closeMigrationModal()"
            class="px-4 py-2 text-gray-600 hover:text-gray-800"
          >
            Cancel
          </button>
          <button
            onclick="migrateData()"
            class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700"
          >
            <i class="fas fa-upload"></i> Migrate Data
          </button>
        </div>
      </div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-lg shadow-xl w-full max-w-2xl m-4 p-6 relative"
      >
        <h2 id="modalTitle" class="text-2xl font-bold mb-4">Edit Business</h2>
        <div id="businessForm">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-2">
              <label class="block text-sm font-bold mb-1">ID (URL Slug)</label>
              <input
                type="text"
                id="editId"
                required
                class="w-full p-2 border rounded bg-gray-50"
                placeholder="e.g., los-tacos"
              />
              <p class="text-xs text-gray-500">
                This appears in the URL. No spaces.
              </p>
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">Business Name</label>
              <input
                type="text"
                id="editName"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">Phone</label>
              <input
                type="text"
                id="editPhone"
                class="w-full p-2 border rounded"
                placeholder="e.g. 0555..."
              />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">Email</label>
              <input
                type="email"
                id="editEmail"
                class="w-full p-2 border rounded"
                placeholder="contact@example.com"
              />
            </div>
            <div class="col-span-2">
              <label class="block text-sm font-bold mb-1">Image URL</label>
              <input
                type="text"
                id="editImage"
                class="w-full p-2 border rounded"
              />
            </div>
            <div class="col-span-2">
              <label class="block text-sm font-bold mb-1"
                >Gradient / Background Color</label
              >
              <div class="flex gap-2">
                <input
                  type="text"
                  id="editGradient"
                  class="w-full p-2 border rounded"
                  placeholder="linear-gradient(...) or #Hex"
                />
                <input
                  type="color"
                  onchange="
                    document.getElementById('editGradient').value = this.value
                  "
                  class="h-10 w-10 cursor-pointer"
                />
              </div>
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">Address Text</label>
              <input
                type="text"
                id="editAddrText"
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">Maps URL</label>
              <input
                type="text"
                id="editAddrUrl"
                class="w-full p-2 border rounded"
              />
            </div>
            <div class="col-span-2">
              <label class="block text-sm font-bold mb-1">Menu PDF URL</label>
              <input
                type="text"
                id="editMenu"
                class="w-full p-2 border rounded"
              />
            </div>
            <div class="col-span-2 border-t pt-4 mt-2">
              <h3 class="font-bold mb-2">Social Media & Links</h3>
              <div class="grid grid-cols-1 gap-2">
                <div class="flex items-center gap-2">
                  <i class="fab fa-facebook w-6 text-blue-600"></i>
                  <input
                    type="text"
                    id="socialFb"
                    placeholder="Facebook URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-instagram w-6 text-pink-600"></i>
                  <input
                    type="text"
                    id="socialInsta"
                    placeholder="Instagram URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-tiktok w-6 text-black"></i>
                  <input
                    type="text"
                    id="socialTiktok"
                    placeholder="TikTok URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-whatsapp w-6 text-green-500"></i>
                  <input
                    type="text"
                    id="socialWhatsapp"
                    placeholder="WhatsApp URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-youtube w-6 text-red-600"></i>
                  <input
                    type="text"
                    id="socialYoutube"
                    placeholder="YouTube URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fa-brands fa-threads w-6 text-black"></i>
                  <input
                    type="text"
                    id="socialThreads"
                    placeholder="Threads URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-snapchat w-6 text-yellow-500"></i>
                  <input
                    type="text"
                    id="socialSnapchat"
                    placeholder="Snapchat URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-telegram w-6 text-blue-400"></i>
                  <input
                    type="text"
                    id="socialTelegram"
                    placeholder="Telegram URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fab fa-viber w-6 text-purple-600"></i>
                  <input
                    type="text"
                    id="socialViber"
                    placeholder="Viber URL"
                    class="w-full p-2 border rounded"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <i class="fas fa-globe w-6 text-gray-500"></i>
                  <input
                    type="text"
                    id="socialWeb"
                    placeholder="Website / Other"
                    class="w-full p-2 border rounded"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button
              type="button"
              onclick="closeEditModal()"
              class="px-4 py-2 text-gray-600 hover:text-gray-800"
            >
              Cancel
            </button>
            <button
              onclick="saveBusiness()"
              id="saveBtn"
              class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="hidden fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded shadow-lg z-50"
    >
      Operation successful
    </div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;
      let imageLoadErrors = new Set();

      function getDefaultAvatar(name) {
        const initials = name
          ? name
              .split(" ")
              .map((n) => n[0])
              .join("")
              .toUpperCase()
              .slice(0, 2)
          : "?";
        return `data:image/svg+xml,${encodeURIComponent(`<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea;stop-opacity:1" /><stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" /></linearGradient></defs><rect width="150" height="150" fill="url(#grad)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white">${initials}</text></svg>`)}`;
      }

      function handleImageError(img, businessName) {
        const src = img.src;
        if (!imageLoadErrors.has(src)) {
          imageLoadErrors.add(src);
          img.src = getDefaultAvatar(businessName || "Business");
          img.onerror = null;
        }
      }

      window.onerror = function (msg, url, lineNo, columnNo, error) {
        console.error("Error: " + msg + "\nLine: " + lineNo);
        return false;
      };

      window.onload = () => {
        try {
          const stored = localStorage.getItem("supabase_creds");
          if (stored) {
            credentials = JSON.parse(stored);
            document.getElementById("supabaseUrl").value = credentials.url;
            document.getElementById("supabaseKey").value = credentials.key;
          }
        } catch (error) {
          console.error("Error loading credentials:", error);
        }
      };

      function showLoginError(message) {
        const errorDiv = document.getElementById("loginError");
        errorDiv.textContent = message;
        errorDiv.classList.remove("hidden");
      }

      function hideLoginError() {
        document.getElementById("loginError").classList.add("hidden");
      }

      async function authenticate() {
        hideLoginError();
        const btn = document.getElementById("btnAuth");
        try {
          credentials.url = document.getElementById("supabaseUrl").value.trim();
          credentials.key = document.getElementById("supabaseKey").value.trim();
          if (!credentials.url || !credentials.key) {
            showLoginError("Please fill all fields");
            return;
          }
          credentials.url = credentials.url.replace(/\/$/, "");
          btn.disabled = true;
          btn.textContent = "Connecting...";
          const testResponse = await fetch(
            `${credentials.url}/rest/v1/businesses?limit=1`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          if (!testResponse.ok) {
            throw new Error(
              `Connection failed: ${testResponse.status} ${testResponse.statusText}`,
            );
          }
          localStorage.setItem("supabase_creds", JSON.stringify(credentials));
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          await loadData();
        } catch (error) {
          console.error("Authentication error:", error);
          showLoginError("Connection failed: " + error.message);
          btn.disabled = false;
          btn.textContent = "Connect";
        }
      }

      function logout() {
        localStorage.removeItem("supabase_creds");
        location.reload();
      }

      async function loadData() {
        showToast("Loading data...", true);
        try {
          const response = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          if (!response.ok)
            throw new Error(
              `Failed to fetch: ${response.status} ${response.statusText}`,
            );
          const businesses = await response.json();
          globalData = {};
          imageLoadErrors.clear();
          if (Array.isArray(businesses)) {
            businesses.forEach((biz) => {
              if (biz.business_id) globalData[biz.business_id] = biz;
            });
          }
          renderGrid();
          showToast("Data loaded successfully");
        } catch (error) {
          console.error("Load error:", error);
          alert("Error loading data: " + error.message);
        }
      }

      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = "";
        const entries = Object.entries(globalData);
        if (entries.length === 0) {
          grid.innerHTML =
            '<div class="col-span-full text-center py-12 text-gray-500"><i class="fas fa-inbox text-5xl mb-4"></i><p>No businesses yet. Click "Add New" to create one.</p></div>';
          return;
        }
        entries.forEach(([key, biz]) => {
          const card = document.createElement("div");
          card.className =
            "bg-white p-4 rounded-lg shadow hover:shadow-md transition relative group";
          card.dataset.name = (biz.name || "").toLowerCase();
          const imgSrc = biz.image || getDefaultAvatar(biz.name || "Business");
          card.innerHTML = `
            <div class="flex items-center gap-4 mb-4">
              <img src="${imgSrc}" class="w-16 h-16 rounded-full object-cover border-2 border-gray-100" onerror="handleImageError(this, '${(biz.name || "Business").replace(/'/g, "\\'")}')">
              <div><h3 class="font-bold text-lg">${biz.name || "Unnamed"}</h3><p class="text-xs text-gray-500">${key}</p></div>
            </div>
            <div class="flex justify-between items-center text-sm text-gray-600 mt-2">
              <span><i class="fas fa-phone"></i> ${biz.phone || "-"}</span>
              <div class="flex gap-2">${biz.menu ? '<i class="fas fa-file-pdf text-red-500"></i>' : ""}${biz.email ? '<i class="fas fa-envelope text-gray-500"></i>' : ""}</div>
            </div>
            <div class="mt-4 flex gap-2 border-t pt-3">
              <button onclick="editBusiness('${key}')" class="flex-1 bg-blue-50 text-blue-600 py-1 rounded hover:bg-blue-100">Edit</button>
              <button onclick="deleteBusiness('${key}')" class="flex-1 bg-red-50 text-red-600 py-1 rounded hover:bg-red-100">Delete</button>
              <a href="/${key}" target="_blank" class="flex-1 bg-gray-50 text-gray-600 py-1 rounded hover:bg-gray-100 text-center"><i class="fas fa-external-link-alt"></i></a>
            </div>`;
          grid.appendChild(card);
        });
      }

      function openModal(mode, key = null) {
        const modal = document.getElementById("editModal");
        const idInput = document.getElementById("editId");
        document.getElementById("editName").value = "";
        document.getElementById("editPhone").value = "";
        document.getElementById("editEmail").value = "";
        document.getElementById("editImage").value = "";
        document.getElementById("editGradient").value = "";
        document.getElementById("editMenu").value = "";
        document.getElementById("editAddrText").value = "";
        document.getElementById("editAddrUrl").value = "";
        document.getElementById("socialFb").value = "";
        document.getElementById("socialInsta").value = "";
        document.getElementById("socialTiktok").value = "";
        document.getElementById("socialWhatsapp").value = "";
        document.getElementById("socialWeb").value = "";
        document.getElementById("socialSnapchat").value = "";
        document.getElementById("socialTelegram").value = "";
        document.getElementById("socialViber").value = "";
        document.getElementById("socialYoutube").value = "";
        document.getElementById("socialThreads").value = "";
        modal.classList.remove("hidden");
        if (mode === "edit" && key) {
          currentEditId = key;
          const data = globalData[key];
          document.getElementById("modalTitle").textContent =
            `Edit: ${data.name}`;
          idInput.value = key;
          idInput.readOnly = true;
          idInput.classList.add("bg-gray-200");
          document.getElementById("editName").value = data.name || "";
          document.getElementById("editPhone").value = data.phone || "";
          document.getElementById("editEmail").value = data.email || "";
          document.getElementById("editImage").value = data.image || "";
          document.getElementById("editGradient").value = data.gradient || "";
          document.getElementById("editMenu").value = data.menu || "";
          if (data.address) {
            document.getElementById("editAddrText").value =
              data.address.text || "";
            document.getElementById("editAddrUrl").value =
              data.address.url || "";
          }
          if (data.socials) {
            document.getElementById("socialFb").value =
              data.socials.facebook || "";
            document.getElementById("socialInsta").value =
              data.socials.instagram || "";
            document.getElementById("socialTiktok").value =
              data.socials.tiktok || "";
            document.getElementById("socialWhatsapp").value =
              data.socials.whatsapp || "";
            document.getElementById("socialWeb").value =
              data.socials.website || "";
            document.getElementById("socialSnapchat").value =
              data.socials.snapchat || "";
            document.getElementById("socialTelegram").value =
              data.socials.telegram || "";
            document.getElementById("socialViber").value =
              data.socials.viber || "";
            document.getElementById("socialYoutube").value =
              data.socials.youtube || "";
            document.getElementById("socialThreads").value =
              data.socials.threads || "";
          }
        } else {
          currentEditId = null;
          document.getElementById("modalTitle").textContent =
            "Add New Business";
          idInput.value = "";
          idInput.readOnly = false;
          idInput.classList.remove("bg-gray-200");
        }
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }

      window.editBusiness = (key) => openModal("edit", key);

      async function saveBusiness() {
        const btn = document.getElementById("saveBtn");
        btn.textContent = "Saving...";
        btn.disabled = true;
        try {
          const id = document
            .getElementById("editId")
            .value.trim()
            .toLowerCase();
          if (!id) {
            alert("ID is required");
            return;
          }
          const isNew = !currentEditId;
          const businessData = {
            business_id: id,
            name: document.getElementById("editName").value,
            image: document.getElementById("editImage").value || null,
            phone: document.getElementById("editPhone").value || null,
            email: document.getElementById("editEmail").value || null,
            gradient: document.getElementById("editGradient").value || null,
            menu: document.getElementById("editMenu").value || null,
            address: {
              text: document.getElementById("editAddrText").value || "",
              url: document.getElementById("editAddrUrl").value || "",
            },
            socials: {
              facebook: document.getElementById("socialFb").value || null,
              instagram: document.getElementById("socialInsta").value || null,
              tiktok: document.getElementById("socialTiktok").value || null,
              whatsapp: document.getElementById("socialWhatsapp").value || null,
              website: document.getElementById("socialWeb").value || null,
              snapchat: document.getElementById("socialSnapchat").value || null,
              telegram: document.getElementById("socialTelegram").value || null,
              viber: document.getElementById("socialViber").value || null,
              youtube: document.getElementById("socialYoutube").value || null,
              threads: document.getElementById("socialThreads").value || null,
            },
          };
          let response;
          if (isNew) {
            response = await fetch(`${credentials.url}/rest/v1/businesses`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
                Prefer: "return=representation",
              },
              body: JSON.stringify(businessData),
            });
            if (response.ok) await generateAccessCode(id);
          } else {
            response = await fetch(
              `${credentials.url}/rest/v1/businesses?business_id=eq.${id}`,
              {
                method: "PATCH",
                headers: {
                  "Content-Type": "application/json",
                  apikey: credentials.key,
                  Authorization: `Bearer ${credentials.key}`,
                },
                body: JSON.stringify({
                  ...businessData,
                  updated_at: new Date().toISOString(),
                }),
              },
            );
          }
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || "Failed to save");
          }
          closeEditModal();
          await loadData();
          showToast(isNew ? "Business created!" : "Business updated!");
        } catch (error) {
          console.error("Save error:", error);
          alert("Error saving business: " + error.message);
        } finally {
          btn.textContent = "Save Changes";
          btn.disabled = false;
        }
      }

      async function generateAccessCode(businessId) {
        try {
          const chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
          let accessCode = "";
          for (let i = 0; i < 16; i++) {
            accessCode += chars.charAt(
              Math.floor(Math.random() * chars.length),
            );
          }
          const encoder = new TextEncoder();
          const data = encoder.encode(accessCode);
          const hashBuffer = await crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const accessCodeHash = hashArray
            .map((b) => b.toString(16).padStart(2, "0"))
            .join("");
          const response = await fetch(
            `${credentials.url}/rest/v1/business_access`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify({
                business_id: businessId,
                access_code_hash: accessCodeHash,
              }),
            },
          );
          if (response.ok) return accessCode;
          return null;
        } catch (error) {
          console.error("Error generating access code for", businessId, error);
          return null;
        }
      }

      function showAccessCodesModal(accessCodes, successCount, errorCount) {
        let csvContent = "Business ID,Business Name,Access Code,Portal URL\n";
        accessCodes.forEach((item) => {
          csvContent += `"${item.businessId}","${item.businessName}","${item.accessCode}","${window.location.origin}/portal"\n`;
        });
        let textContent = `MIGRATION COMPLETE\n===================\n\n✅ Successfully migrated: ${successCount}\n❌ Errors: ${errorCount}\n\n⚠️ IMPORTANT: Save these access codes! They won't be shown again.\n\nACCESS CODES:\n===================\n\n`;
        accessCodes.forEach((item) => {
          textContent += `Business: ${item.businessName}\nID: ${item.businessId}\nAccess Code: ${item.accessCode}\nPortal: ${window.location.origin}/portal\n-------------------\n\n`;
        });
        const modal = document.createElement("div");
        modal.className =
          "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4";
        modal.innerHTML = `
          <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b">
              <h2 class="text-2xl font-bold text-green-600"><i class="fas fa-check-circle"></i> Migration Complete!</h2>
              <p class="text-gray-600 mt-2">Migrated ${successCount} businesses successfully. ${errorCount > 0 ? `${errorCount} errors occurred.` : ""}</p>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
              <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                <div class="flex">
                  <i class="fas fa-exclamation-triangle text-yellow-400 mt-1"></i>
                  <div class="ml-3">
                    <p class="text-sm text-yellow-700 font-bold">⚠️ SAVE THESE ACCESS CODES NOW!</p>
                    <p class="text-sm text-yellow-700 mt-1">These codes will NOT be shown again. Download or copy them before closing.</p>
                  </div>
                </div>
              </div>
              <div class="space-y-3">
                ${accessCodes
                  .map(
                    (item) => `
                  <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                      <div><strong class="text-gray-700">Business:</strong><span class="ml-2">${item.businessName}</span></div>
                      <div><strong class="text-gray-700">ID:</strong><span class="ml-2 font-mono text-blue-600">${item.businessId}</span></div>
                      <div class="md:col-span-2"><strong class="text-gray-700">Access Code:</strong><code class="ml-2 bg-yellow-100 px-3 py-1 rounded font-mono text-lg font-bold">${item.accessCode}</code></div>
                    </div>
                  </div>
                `,
                  )
                  .join("")}
              </div>
            </div>
            <div class="p-6 border-t bg-gray-50 flex gap-3">
              <button onclick="downloadAccessCodes('${btoa(csvContent)}', 'csv')" class="flex-1 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold"><i class="fas fa-download"></i> Download CSV</button>
              <button onclick="downloadAccessCodes('${btoa(textContent)}', 'txt')" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-semibold"><i class="fas fa-file-alt"></i> Download TXT</button>
              <button onclick="copyAccessCodes('${btoa(textContent)}')" class="flex-1 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 font-semibold"><i class="fas fa-copy"></i> Copy All</button>
              <button onclick="this.closest('.fixed').remove()" class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700 font-semibold">Close</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
      }

      function downloadAccessCodes(base64Content, format) {
        const content = atob(base64Content);
        const blob = new Blob([content], {
          type: format === "csv" ? "text/csv" : "text/plain",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `access-codes-${new Date().toISOString().split("T")[0]}.${format}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`✅ Downloaded access codes as ${format.toUpperCase()}`);
      }

      function copyAccessCodes(base64Content) {
        const content = atob(base64Content);
        navigator.clipboard
          .writeText(content)
          .then(() => {
            showToast("✅ Access codes copied to clipboard!");
          })
          .catch((err) => {
            alert("Failed to copy. Please download instead.");
          });
      }

      function filterGrid() {
        const term = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#businessGrid > div").forEach((card) => {
          const name = card.dataset.name || "";
          card.style.display = name.includes(term) ? "block" : "none";
        });
      }

      function showToast(msg, persist = false) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.remove("hidden");
        if (!persist) setTimeout(() => t.classList.add("hidden"), 3000);
      }
    </script>
  </body>
</html>
