<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Manager | Master Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .social-input {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #e2e8f0;
        padding: 10px;
        border-radius: 12px;
        background: #fff;
      }
      .social-input i {
        width: 20px;
        text-align: center;
      }
      .social-input input {
        border: none;
        outline: none;
        width: 100%;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black mb-6 text-slate-800 text-center">
          Admin Access
        </h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm"
        ></div>
        <div class="space-y-4">
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-4 border rounded-2xl"
            placeholder="Supabase URL"
          />
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-4 border rounded-2xl"
            placeholder="Service Role Key"
          />
          <button
            onclick="authenticate()"
            id="btnAuth"
            class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition"
          >
            Connect Dashboard
          </button>
        </div>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-10">
      <div
        class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6"
      >
        <div>
          <h1 class="text-4xl font-black text-slate-900">Console Control</h1>
          <p class="text-slate-500">
            Manage cards, addresses, and social links.
          </p>
        </div>
        <div class="flex gap-3">
          <button
            onclick="loadData()"
            class="bg-white border px-6 py-3 rounded-2xl font-bold hover:bg-slate-50"
          >
            Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-indigo-700"
          >
            Add Business
          </button>
          <button onclick="logout()" class="text-red-500 font-bold px-4">
            Logout
          </button>
        </div>
      </div>

      <input
        type="text"
        id="search"
        onkeyup="filterGrid()"
        placeholder="Search by name or ID..."
        class="w-full p-5 border-none rounded-3xl shadow-sm mb-10 outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      ></div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-4xl m-4 p-10 relative"
      >
        <div class="flex justify-between items-center mb-8">
          <h2 id="modalTitle" class="text-3xl font-black text-slate-800">
            Business Setup
          </h2>
          <button
            onclick="closeEditModal()"
            class="text-slate-300 hover:text-slate-600 text-4xl"
          >
            &times;
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
          <div class="space-y-6">
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-2"
                >Logo/Image URL</label
              >
              <input
                type="text"
                id="editImage"
                class="w-full p-3 border rounded-xl mb-2 text-sm"
                placeholder="https://..."
              />
              <div
                class="w-24 h-24 rounded-full border bg-slate-100 mx-auto overflow-hidden"
              >
                <img
                  id="imagePreview"
                  src=""
                  class="w-full h-full object-cover"
                  onerror="
                    this.src = 'https://via.placeholder.com/100?text=No+Image'
                  "
                />
              </div>
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-2"
                >Background Gradient</label
              >
              <input
                type="text"
                id="editGradient"
                class="w-full p-3 border rounded-xl text-sm"
                placeholder="linear-gradient(...)"
              />
              <input
                type="color"
                onchange="
                  document.getElementById('editGradient').value =
                    `linear-gradient(135deg, ${this.value} 0%, #111111 100%)`
                "
                class="mt-2 w-full h-8 rounded-lg cursor-pointer"
              />
            </div>
          </div>

          <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-2">
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Unique ID (URL Slug)</label
              >
              <input
                type="text"
                id="editId"
                class="w-full p-3 border rounded-xl font-bold text-indigo-600"
                placeholder="e.g. restaurant-xyz"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Business Name</label
              >
              <input
                type="text"
                id="editName"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Phone</label
              >
              <input
                type="text"
                id="editPhone"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Email</label
              >
              <input
                type="email"
                id="editEmail"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Menu PDF URL</label
              >
              <input
                type="text"
                id="editMenu"
                class="w-full p-3 border rounded-xl"
              />
            </div>

            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Address Text</label
              >
              <input
                type="text"
                id="editAddrText"
                class="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold uppercase text-slate-400 mb-1"
                >Maps URL</label
              >
              <input
                type="text"
                id="editAddrUrl"
                class="w-full p-3 border rounded-xl"
              />
            </div>
          </div>

          <div class="md:col-span-3 border-t pt-8 mt-4">
            <h3 class="font-black text-slate-800 text-lg mb-6">
              Social Media Links
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="social-input">
                <i class="fab fa-facebook text-blue-600"></i
                ><input type="text" id="socialFb" placeholder="Facebook" />
              </div>
              <div class="social-input">
                <i class="fab fa-instagram text-pink-600"></i
                ><input type="text" id="socialInsta" placeholder="Instagram" />
              </div>
              <div class="social-input">
                <i class="fab fa-tiktok text-black"></i
                ><input type="text" id="socialTiktok" placeholder="TikTok" />
              </div>
              <div class="social-input">
                <i class="fab fa-whatsapp text-green-500"></i
                ><input
                  type="text"
                  id="socialWhatsapp"
                  placeholder="WhatsApp"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-youtube text-red-600"></i
                ><input type="text" id="socialYoutube" placeholder="YouTube" />
              </div>
              <div class="social-input">
                <i class="fab fa-telegram text-blue-400"></i
                ><input
                  type="text"
                  id="socialTelegram"
                  placeholder="Telegram"
                />
              </div>
              <div class="social-input">
                <i class="fas fa-globe text-slate-400"></i
                ><input type="text" id="socialWeb" placeholder="Website" />
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-4 mt-10 pt-8 border-t">
          <button
            onclick="closeEditModal()"
            class="text-slate-400 font-bold px-6"
          >
            Cancel
          </button>
          <button
            onclick="saveBusiness()"
            id="saveBtn"
            class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-xl hover:bg-indigo-700"
          >
            Save Business
          </button>
        </div>
      </div>
    </div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;

      // AUTHENTICATION
      async function authenticate() {
        const url = document
          .getElementById("supabaseUrl")
          .value.trim()
          .replace(/\/$/, "");
        const key = document.getElementById("supabaseKey").value.trim();
        const btn = document.getElementById("btnAuth");
        if (!url || !key) return alert("Fill both fields");

        btn.disabled = true;
        btn.textContent = "Connecting...";
        try {
          const res = await fetch(`${url}/rest/v1/businesses?limit=1`, {
            headers: { apikey: key, Authorization: `Bearer ${key}` },
          });
          if (!res.ok) throw new Error("Invalid credentials");
          credentials = { url, key };
          localStorage.setItem("supabase_creds", JSON.stringify(credentials));
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          loadData();
        } catch (e) {
          alert(e.message);
          btn.disabled = false;
          btn.textContent = "Connect";
        }
      }

      // LOAD DATA
      async function loadData() {
        try {
          const res = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          const businesses = await res.json();
          globalData = {};
          businesses.forEach((b) => (globalData[b.business_id] = b));
          renderGrid();
        } catch (e) {
          console.error("Load Failed");
        }
      }

      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = Object.entries(globalData)
          .map(
            ([id, biz]) => `
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-md transition card-item" data-name="${(biz.name || "").toLowerCase()}">
            <div class="flex items-center gap-4 mb-4">
              <img src="${biz.image || "https://via.placeholder.com/50"}" class="w-12 h-12 rounded-full object-cover bg-slate-100">
              <div>
                <h3 class="font-bold text-slate-800">${biz.name || "Unnamed"}</h3>
                <p class="text-xs text-slate-400 font-mono">${id}</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="editBusiness('${id}')" class="flex-1 bg-indigo-50 text-indigo-600 py-2 rounded-xl font-bold text-sm">Edit</button>
              <button onclick="deleteBusiness('${id}')" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-sm"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `,
          )
          .join("");
      }

      // SAVE BUSINESS
      async function saveBusiness() {
        const saveBtn = document.getElementById("saveBtn");
        const id = document.getElementById("editId").value.trim().toLowerCase();
        if (!id) return alert("ID Required");

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";

        const payload = {
          business_id: id,
          name: document.getElementById("editName").value,
          phone: document.getElementById("editPhone").value,
          email: document.getElementById("editEmail").value,
          image: document.getElementById("editImage").value,
          gradient: document.getElementById("editGradient").value,
          menu: document.getElementById("editMenu").value,
          address: {
            text: document.getElementById("editAddrText").value,
            url: document.getElementById("editAddrUrl").value,
          },
          socials: {
            facebook: document.getElementById("socialFb").value,
            instagram: document.getElementById("socialInsta").value,
            tiktok: document.getElementById("socialTiktok").value,
            whatsapp: document.getElementById("socialWhatsapp").value,
            youtube: document.getElementById("socialYoutube").value,
            telegram: document.getElementById("socialTelegram").value,
            website: document.getElementById("socialWeb").value,
          },
        };

        try {
          const isNew = !currentEditId;
          const url = isNew
            ? `${credentials.url}/rest/v1/businesses`
            : `${credentials.url}/rest/v1/businesses?business_id=eq.${id}`;

          const res = await fetch(url, {
            method: isNew ? "POST" : "PATCH",
            headers: {
              "Content-Type": "application/json",
              apikey: credentials.key,
              Authorization: `Bearer ${credentials.key}`,
              Prefer: "return=minimal",
            },
            body: JSON.stringify(payload),
          });

          if (!res.ok) throw new Error("Database error");

          closeEditModal();
          setTimeout(loadData, 500); // Give database a moment to refresh
        } catch (e) {
          alert(e.message);
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Business";
      }

      // HELPERS
      function openModal(mode, id = null) {
        currentEditId = id;
        document.getElementById("editModal").classList.remove("hidden");
        const b = id ? globalData[id] : { socials: {}, address: {} };

        document.getElementById("editId").value = id || "";
        document.getElementById("editId").disabled = !!id;
        document.getElementById("editName").value = b.name || "";
        document.getElementById("editPhone").value = b.phone || "";
        document.getElementById("editEmail").value = b.email || "";
        document.getElementById("editImage").value = b.image || "";
        document.getElementById("editGradient").value = b.gradient || "";
        document.getElementById("editMenu").value = b.menu || "";
        document.getElementById("editAddrText").value = b.address?.text || "";
        document.getElementById("editAddrUrl").value = b.address?.url || "";

        const s = b.socials || {};
        document.getElementById("socialFb").value = s.facebook || "";
        document.getElementById("socialInsta").value = s.instagram || "";
        document.getElementById("socialTiktok").value = s.tiktok || "";
        document.getElementById("socialWhatsapp").value = s.whatsapp || "";
        document.getElementById("socialYoutube").value = s.youtube || "";
        document.getElementById("socialTelegram").value = s.telegram || "";
        document.getElementById("socialWeb").value = s.website || "";
      }

      window.editBusiness = (id) => openModal("edit", id);
      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }
      function logout() {
        localStorage.removeItem("supabase_creds");
        location.reload();
      }
      function filterGrid() {
        const term = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll(".card-item").forEach((c) => {
          c.style.display =
            c.dataset.name.includes(term) ||
            c.innerText.toLowerCase().includes(term)
              ? "block"
              : "none";
        });
      }

      window.onload = () => {
        const stored = localStorage.getItem("supabase_creds");
        if (stored) {
          credentials = JSON.parse(stored);
          document.getElementById("supabaseUrl").value = credentials.url;
          document.getElementById("supabaseKey").value = credentials.key;
          authenticate();
        }
      };
    </script>
  </body>
</html>
