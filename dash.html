<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Business Manager | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .success-glow {
        animation: glow 2s infinite;
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(34, 197, 94, 0.2);
        }
        50% {
          box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
        <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">
          Admin Login
        </h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"
        ></div>
        <div class="mb-4">
          <label class="block text-xs font-bold uppercase text-gray-500 mb-1"
            >Supabase URL</label
          >
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-3 border rounded-xl"
            placeholder="https://xxx.supabase.co"
          />
        </div>
        <div class="mb-6">
          <label class="block text-xs font-bold uppercase text-gray-500 mb-1"
            >Service Role Key</label
          >
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-3 border rounded-xl"
            placeholder="Secret Key"
          />
        </div>
        <button
          onclick="authenticate()"
          id="btnAuth"
          class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition"
        >
          Connect
        </button>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-8">
      <div
        class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4"
      >
        <h1 class="text-3xl font-black text-gray-800">Business Manager</h1>
        <div class="flex gap-2 w-full md:w-auto">
          <button
            onclick="loadData()"
            class="flex-1 md:flex-none bg-white border px-4 py-2 rounded-lg font-bold text-gray-600 hover:bg-gray-50"
          >
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="flex-1 md:flex-none bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700"
          >
            Add Business
          </button>
          <button
            onclick="logout()"
            class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold"
          >
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>

      <div class="mb-6">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search by business name..."
          class="w-full p-4 border rounded-2xl shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>

      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-2xl shadow-xl w-full max-w-3xl m-4 p-8 relative"
      >
        <div class="flex justify-between items-center mb-6">
          <h2 id="modalTitle" class="text-2xl font-bold">Business Details</h2>
          <button
            onclick="closeEditModal()"
            class="text-gray-400 hover:text-gray-600 text-2xl"
          >
            &times;
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase text-gray-400"
                >ID (URL Slug)</label
              >
              <input
                type="text"
                id="editId"
                class="w-full p-2 border rounded-lg bg-gray-50"
                placeholder="e.g. burger-shop"
              />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-gray-400"
                >Business Name</label
              >
              <input
                type="text"
                id="editName"
                class="w-full p-2 border rounded-lg"
              />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-gray-400"
                >Photo Upload</label
              >
              <div class="flex items-center gap-3 mt-1">
                <input type="file" id="fileInput" class="text-xs w-full" />
                <input type="hidden" id="editImage" />
              </div>
            </div>
          </div>

          <div
            class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-3"
          >
            <h3 class="text-indigo-800 font-bold text-sm uppercase">
              <i class="fas fa-shield-alt mr-2"></i> Access & Preview
            </h3>
            <div>
              <label class="block text-[10px] font-bold text-indigo-400"
                >Client Access Code</label
              >
              <input
                type="text"
                id="displayCode"
                readonly
                class="w-full bg-transparent border-none font-mono text-lg text-indigo-700 p-0 focus:ring-0"
                value="Generated on save"
              />
            </div>
            <div id="previewLinkContainer" class="hidden">
              <label class="block text-[10px] font-bold text-indigo-400"
                >Public Link</label
              >
              <a
                id="previewBtn"
                target="_blank"
                class="text-indigo-600 underline font-bold text-sm block truncate"
                >Click to View Page</a
              >
            </div>
          </div>

          <div class="col-span-2 border-t pt-4">
            <h3 class="font-bold mb-3 text-sm">Social Networks</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              <input
                type="text"
                id="socialFb"
                placeholder="Facebook URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialInsta"
                placeholder="Instagram URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialTiktok"
                placeholder="TikTok URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialLinkedin"
                placeholder="LinkedIn URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialX"
                placeholder="X / Twitter URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialPinterest"
                placeholder="Pinterest URL"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialWhatsapp"
                placeholder="WhatsApp Number"
                class="p-2 border rounded-lg text-sm"
              />
              <input
                type="text"
                id="socialWeb"
                placeholder="Website URL"
                class="p-2 border rounded-lg text-sm"
              />
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t">
          <button
            onclick="closeEditModal()"
            class="text-gray-500 font-bold px-4"
          >
            Cancel
          </button>
          <button
            onclick="saveBusiness()"
            id="saveBtn"
            class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition"
          >
            Save Business
          </button>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="fixed bottom-5 right-5 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl z-50 hidden"
    ></div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;

      // AUTH & LOADING
      async function authenticate() {
        const btn = document.getElementById("btnAuth");
        credentials.url = document
          .getElementById("supabaseUrl")
          .value.trim()
          .replace(/\/$/, "");
        credentials.key = document.getElementById("supabaseKey").value.trim();
        if (!credentials.url || !credentials.key) return;
        btn.disabled = true;
        try {
          const res = await fetch(
            `${credentials.url}/rest/v1/businesses?limit=1`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          if (!res.ok) throw new Error();
          localStorage.setItem("supabase_creds", JSON.stringify(credentials));
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          loadData();
        } catch (e) {
          alert("Invalid credentials");
          btn.disabled = false;
        }
      }

      async function loadData() {
        try {
          const res = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*,business_access(*)`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          const data = await res.json();
          globalData = {};
          data.forEach((b) => (globalData[b.business_id] = b));
          renderGrid();
        } catch (e) {
          console.error(e);
        }
      }

      // RENDER GRID WITH VIEW BUTTON
      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = "";
        Object.entries(globalData).forEach(([id, biz]) => {
          const code = biz.business_access?.[0]?.access_code_raw || "Hashed";
          const div = document.createElement("div");
          div.className =
            "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition";
          div.dataset.name = biz.name.toLowerCase();
          div.innerHTML = `
                    <div class="flex items-center gap-4 mb-4">
                        <img src="${biz.image || "https://via.placeholder.com/150"}" class="w-14 h-14 rounded-full object-cover bg-gray-100">
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-gray-800 truncate">${biz.name}</h3>
                            <p class="text-[10px] text-indigo-500 font-bold uppercase tracking-wider">Code: ${code}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editBusiness('${id}')" class="flex-1 py-2 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-lg">Edit</button>
                        <a href="ind.html?id=${id}" target="_blank" class="flex-1 py-2 text-center text-sm font-bold text-green-600 bg-green-50 rounded-lg"><i class="fas fa-external-link-alt mr-1"></i> View</a>
                        <button onclick="deleteBusiness('${id}')" class="px-3 py-2 text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                `;
          grid.appendChild(div);
        });
      }

      // SAVE LOGIC WITH INSTANT CODE REVEAL
      async function saveBusiness() {
        const id = document.getElementById("editId").value.trim().toLowerCase();
        const isNew = !currentEditId;
        const file = document.getElementById("fileInput").files[0];

        if (!id) return alert("ID is required");

        const btn = document.getElementById("saveBtn");
        btn.disabled = true;

        try {
          let imageUrl = document.getElementById("editImage").value;
          if (file) {
            const fileName = `${id}-${Date.now()}`;
            const res = await fetch(
              `${credentials.url}/storage/v1/object/business-images/${fileName}`,
              {
                method: "POST",
                headers: {
                  apikey: credentials.key,
                  Authorization: `Bearer ${credentials.key}`,
                  "Content-Type": file.type,
                },
                body: file,
              },
            );
            if (res.ok)
              imageUrl = `${credentials.url}/storage/v1/object/public/business-images/${fileName}`;
          }

          const bizData = {
            business_id: id,
            name: document.getElementById("editName").value,
            image: imageUrl,
            socials: {
              facebook: document.getElementById("socialFb").value,
              instagram: document.getElementById("socialInsta").value,
              tiktok: document.getElementById("socialTiktok").value,
              linkedin: document.getElementById("socialLinkedin").value,
              twitter: document.getElementById("socialX").value,
              pinterest: document.getElementById("socialPinterest").value,
              whatsapp: document.getElementById("socialWhatsapp").value,
              website: document.getElementById("socialWeb").value,
            },
          };

          await fetch(
            `${credentials.url}/rest/v1/businesses${isNew ? "" : "?business_id=eq." + id}`,
            {
              method: isNew ? "POST" : "PATCH",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify(bizData),
            },
          );

          if (isNew) {
            const rawCode = Math.random().toString(36).slice(-8).toUpperCase();
            const hash = await hashString(rawCode);
            await fetch(`${credentials.url}/rest/v1/business_access`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
              body: JSON.stringify({
                business_id: id,
                access_code_hash: hash,
                access_code_raw: rawCode,
              }),
            });

            // Reveal code immediately in the modal
            document.getElementById("displayCode").value = rawCode;
            document
              .getElementById("previewLinkContainer")
              .classList.remove("hidden");
            document.getElementById("previewBtn").href = `ind.html?id=${id}`;
            alert(
              `Business Created Successfully!\n\nAccess Code: ${rawCode}\n\nKeep the modal open if you want to copy the code.`,
            );
          }

          loadData();
          if (!isNew) closeEditModal();
        } catch (e) {
          alert("Save failed");
        }
        btn.disabled = false;
      }

      async function hashString(str) {
        const msgUint8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
        return Array.from(new Uint8Array(hashBuffer))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      function openModal(mode, id = null) {
        currentEditId = id;
        document.getElementById("editModal").classList.remove("hidden");
        document.getElementById("previewLinkContainer").classList.add("hidden");

        if (id) {
          const b = globalData[id];
          document.getElementById("editId").value = b.business_id;
          document.getElementById("editId").disabled = true;
          document.getElementById("editName").value = b.name || "";
          document.getElementById("editImage").value = b.image || "";
          document.getElementById("displayCode").value =
            b.business_access?.[0]?.access_code_raw || "Hashed";

          document
            .getElementById("previewLinkContainer")
            .classList.remove("hidden");
          document.getElementById("previewBtn").href = `ind.html?id=${id}`;

          document.getElementById("socialFb").value = b.socials?.facebook || "";
          document.getElementById("socialInsta").value =
            b.socials?.instagram || "";
          document.getElementById("socialTiktok").value =
            b.socials?.tiktok || "";
          document.getElementById("socialLinkedin").value =
            b.socials?.linkedin || "";
          document.getElementById("socialX").value = b.socials?.twitter || "";
          document.getElementById("socialPinterest").value =
            b.socials?.pinterest || "";
          document.getElementById("socialWhatsapp").value =
            b.socials?.whatsapp || "";
          document.getElementById("socialWeb").value = b.socials?.website || "";
        } else {
          document.getElementById("editId").value = "";
          document.getElementById("editId").disabled = false;
          document.getElementById("displayCode").value = "Generated on save";
          document
            .querySelectorAll("#editModal input")
            .forEach((i) => (i.type !== "file" ? (i.value = "") : null));
        }
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }
      window.editBusiness = (id) => openModal("edit", id);
      function logout() {
        localStorage.removeItem("supabase_creds");
        location.reload();
      }
      function filterGrid() {
        const term = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#businessGrid > div").forEach((c) => {
          c.style.display = c.dataset.name.includes(term) ? "block" : "none";
        });
      }
    </script>
  </body>
</html>
