<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Business Manager | Full Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .social-input {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e2e8f0;
        padding: 8px;
        border-radius: 12px;
      }
      .social-input i {
        width: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Dashboard Login</h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"
        ></div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Supabase URL</label>
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-2 border rounded"
            placeholder="https://xxxxx.supabase.co"
          />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Service Role Key</label>
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-2 border rounded"
            placeholder="eyJhbGc..."
          />
        </div>
        <button
          onclick="authenticate()"
          id="btnAuth"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          Connect
        </button>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Business Manager</h1>
        <div class="flex gap-2">
          <button onclick="loadData()" class="bg-gray-200 px-4 py-2 rounded">
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-green-600 text-white px-4 py-2 rounded"
          >
            <i class="fas fa-plus"></i> Add New
          </button>
          <button
            onclick="showMigrationModal()"
            class="bg-purple-600 text-white px-4 py-2 rounded"
          >
            <i class="fas fa-database"></i> Migrate JSON
          </button>
          <button
            onclick="logout()"
            class="bg-red-600 text-white px-4 py-2 rounded"
          >
            Logout
          </button>
        </div>
      </div>

      <div class="mb-6">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search businesses..."
          class="w-full p-3 border rounded-lg shadow-sm"
        />
      </div>

      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <div
      id="migrationModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40"
    >
      <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl m-4 p-6">
        <h2 class="text-2xl font-bold mb-4">Migrate Data</h2>
        <textarea
          id="jsonContent"
          rows="10"
          class="w-full p-3 border rounded font-mono text-sm mb-4"
          placeholder="Paste your JSON here..."
        ></textarea>
        <div class="flex justify-end gap-3">
          <button onclick="closeMigrationModal()">Cancel</button>
          <button
            onclick="migrateData()"
            class="bg-purple-600 text-white px-6 py-2 rounded"
          >
            Migrate
          </button>
        </div>
      </div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-lg shadow-xl w-full max-w-3xl m-4 p-8 relative"
      >
        <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-gray-800">
          Setup Business
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="col-span-2">
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Unique ID (URL Slug)</label
            >
            <input
              type="text"
              id="editId"
              class="w-full p-2 border rounded font-bold text-blue-600"
            />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Business Name</label
            >
            <input
              type="text"
              id="editName"
              class="w-full p-2 border rounded"
            />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Phone</label
            >
            <input
              type="text"
              id="editPhone"
              class="w-full p-2 border rounded"
            />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Email</label
            >
            <input
              type="email"
              id="editEmail"
              class="w-full p-2 border rounded"
            />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Image URL</label
            >
            <input
              type="text"
              id="editImage"
              class="w-full p-2 border rounded"
            />
          </div>

          <div class="col-span-2">
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Background Gradient</label
            >
            <div class="flex gap-2">
              <input
                type="text"
                id="editGradient"
                class="flex-1 p-2 border rounded"
              />
              <input
                type="color"
                onchange="
                  document.getElementById('editGradient').value =
                    `linear-gradient(135deg, ${this.value} 0%, #1a1a1a 100%)`
                "
                class="w-10 h-10"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Address Text</label
            >
            <input
              type="text"
              id="editAddrText"
              class="w-full p-2 border rounded"
              placeholder="123 Rue, Paris"
            />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Maps URL</label
            >
            <input
              type="text"
              id="editAddrUrl"
              class="w-full p-2 border rounded"
              placeholder="https://goo.gl/maps/..."
            />
          </div>

          <div class="col-span-2">
            <label class="block text-xs font-bold uppercase text-gray-400"
              >Menu PDF URL</label
            >
            <input
              type="text"
              id="editMenu"
              class="w-full p-2 border rounded"
            />
          </div>

          <div class="col-span-2 border-t pt-4">
            <h3 class="font-bold mb-4">Social Media Links</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="social-input">
                <i class="fab fa-facebook text-blue-600"></i
                ><input
                  type="text"
                  id="socialFb"
                  placeholder="Facebook URL"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-instagram text-pink-600"></i
                ><input
                  type="text"
                  id="socialInsta"
                  placeholder="Instagram URL"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-tiktok text-black"></i
                ><input
                  type="text"
                  id="socialTiktok"
                  placeholder="TikTok URL"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-whatsapp text-green-500"></i
                ><input
                  type="text"
                  id="socialWhatsapp"
                  placeholder="WhatsApp Number/Link"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-youtube text-red-600"></i
                ><input
                  type="text"
                  id="socialYoutube"
                  placeholder="YouTube URL"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fab fa-telegram text-blue-400"></i
                ><input
                  type="text"
                  id="socialTelegram"
                  placeholder="Telegram URL"
                  class="w-full outline-none"
                />
              </div>
              <div class="social-input">
                <i class="fas fa-globe text-gray-400"></i
                ><input
                  type="text"
                  id="socialWeb"
                  placeholder="Website URL"
                  class="w-full outline-none"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t">
          <button onclick="closeEditModal()" class="text-gray-500 px-4">
            Cancel
          </button>
          <button
            onclick="saveBusiness()"
            id="saveBtn"
            class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold"
          >
            Save Business
          </button>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="hidden fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded shadow-lg z-50"
    >
      Operation successful
    </div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;

      window.onload = () => {
        const stored = localStorage.getItem("supabase_creds");
        if (stored) {
          credentials = JSON.parse(stored);
          document.getElementById("supabaseUrl").value = credentials.url;
          document.getElementById("supabaseKey").value = credentials.key;
          authenticate();
        }
      };

      function showLoginError(msg) {
        const err = document.getElementById("loginError");
        err.textContent = msg;
        err.classList.remove("hidden");
      }

      async function authenticate() {
        const btn = document.getElementById("btnAuth");
        const url = document
          .getElementById("supabaseUrl")
          .value.trim()
          .replace(/\/$/, "");
        const key = document.getElementById("supabaseKey").value.trim();

        if (!url || !key) return;
        btn.disabled = true;
        btn.textContent = "Connecting...";

        try {
          const res = await fetch(`${url}/rest/v1/businesses?limit=1`, {
            headers: { apikey: key, Authorization: `Bearer ${key}` },
          });
          if (!res.ok) throw new Error("Invalid URL or Key");
          credentials = { url, key };
          localStorage.setItem("supabase_creds", JSON.stringify(credentials));
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          loadData();
        } catch (e) {
          showLoginError(e.message);
          btn.disabled = false;
          btn.textContent = "Connect";
        }
      }

      async function loadData() {
        showToast("Loading...");
        try {
          const res = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          const businesses = await res.json();
          globalData = {};
          businesses.forEach((b) => (globalData[b.business_id] = b));
          renderGrid();
        } catch (e) {
          alert("Load failed");
        }
      }

      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = Object.entries(globalData)
          .map(
            ([id, biz]) => `
          <div class="bg-white p-4 rounded-lg shadow">
            <h3 class="font-bold">${biz.name || "Unnamed"}</h3>
            <p class="text-xs text-gray-500">${id}</p>
            <div class="mt-4 flex gap-2">
              <button onclick="editBusiness('${id}')" class="flex-1 bg-blue-50 text-blue-600 py-1 rounded">Edit</button>
              <button onclick="deleteBusiness('${id}')" class="flex-1 bg-red-50 text-red-600 py-1 rounded">Delete</button>
              <a href="/${id}" target="_blank" class="px-2 bg-gray-100 rounded flex items-center"><i class="fas fa-external-link-alt text-gray-400"></i></a>
            </div>
          </div>
        `,
          )
          .join("");
      }

      function openModal(mode, id = null) {
        currentEditId = id;
        document.getElementById("editModal").classList.remove("hidden");
        const b = id ? globalData[id] : { socials: {}, address: {} };

        document.getElementById("editId").value = id || "";
        document.getElementById("editId").disabled = !!id;
        document.getElementById("editName").value = b.name || "";
        document.getElementById("editPhone").value = b.phone || "";
        document.getElementById("editEmail").value = b.email || "";
        document.getElementById("editImage").value = b.image || "";
        document.getElementById("editGradient").value = b.gradient || "";
        document.getElementById("editMenu").value = b.menu || "";

        // Address
        document.getElementById("editAddrText").value = b.address?.text || "";
        document.getElementById("editAddrUrl").value = b.address?.url || "";

        // Socials
        document.getElementById("socialFb").value = b.socials?.facebook || "";
        document.getElementById("socialInsta").value =
          b.socials?.instagram || "";
        document.getElementById("socialTiktok").value = b.socials?.tiktok || "";
        document.getElementById("socialWhatsapp").value =
          b.socials?.whatsapp || "";
        document.getElementById("socialYoutube").value =
          b.socials?.youtube || "";
        document.getElementById("socialTelegram").value =
          b.socials?.telegram || "";
        document.getElementById("socialWeb").value = b.socials?.website || "";
      }

      async function saveBusiness() {
        const id = document.getElementById("editId").value.trim().toLowerCase();
        const payload = {
          business_id: id,
          name: document.getElementById("editName").value,
          phone: document.getElementById("editPhone").value,
          email: document.getElementById("editEmail").value,
          image: document.getElementById("editImage").value,
          gradient: document.getElementById("editGradient").value,
          menu: document.getElementById("editMenu").value,
          address: {
            text: document.getElementById("editAddrText").value,
            url: document.getElementById("editAddrUrl").value,
          },
          socials: {
            facebook: document.getElementById("socialFb").value,
            instagram: document.getElementById("socialInsta").value,
            tiktok: document.getElementById("socialTiktok").value,
            whatsapp: document.getElementById("socialWhatsapp").value,
            youtube: document.getElementById("socialYoutube").value,
            telegram: document.getElementById("socialTelegram").value,
            website: document.getElementById("socialWeb").value,
          },
        };

        const method = currentEditId ? "PATCH" : "POST";
        const url = currentEditId
          ? `${credentials.url}/rest/v1/businesses?business_id=eq.${id}`
          : `${credentials.url}/rest/v1/businesses`;

        await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
            apikey: credentials.key,
            Authorization: `Bearer ${credentials.key}`,
          },
          body: JSON.stringify(payload),
        });

        closeEditModal();
        loadData();
        showToast("Saved!");
      }

      // Migration & Utilities
      function showMigrationModal() {
        document.getElementById("migrationModal").classList.remove("hidden");
      }
      function closeMigrationModal() {
        document.getElementById("migrationModal").classList.add("hidden");
      }
      async function migrateData() {
        const data = JSON.parse(document.getElementById("jsonContent").value);
        for (const [id, biz] of Object.entries(data)) {
          await fetch(`${credentials.url}/rest/v1/businesses`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: credentials.key,
              Authorization: `Bearer ${credentials.key}`,
            },
            body: JSON.stringify({ business_id: id, ...biz }),
          });
        }
        location.reload();
      }

      function deleteBusiness(id) {
        if (!confirm("Delete?")) return;
        fetch(`${credentials.url}/rest/v1/businesses?business_id=eq.${id}`, {
          method: "DELETE",
          headers: {
            apikey: credentials.key,
            Authorization: `Bearer ${credentials.key}`,
          },
        }).then(() => loadData());
      }

      window.editBusiness = (id) => openModal("edit", id);
      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }
      function logout() {
        localStorage.removeItem("supabase_creds");
        location.reload();
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.remove("hidden");
        setTimeout(() => t.classList.add("hidden"), 2000);
      }
      function filterGrid() {
        const term = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#businessGrid > div").forEach((card) => {
          card.style.display = card.innerText.toLowerCase().includes(term)
            ? "block"
            : "none";
        });
      }
    </script>
  </body>
</html>
