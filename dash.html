<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Business Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      id="loginModal"
      class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Dashboard Login</h2>
        <div
          id="loginError"
          class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"
        ></div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Supabase URL</label>
          <input
            type="text"
            id="supabaseUrl"
            class="w-full p-2 border rounded"
            placeholder="https://xxxxx.supabase.co"
          />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Service Role Key</label>
          <input
            type="password"
            id="supabaseKey"
            class="w-full p-2 border rounded"
            placeholder="eyJhbGc..."
          />
        </div>
        <button
          onclick="authenticate()"
          id="btnAuth"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          Connect
        </button>
      </div>
    </div>

    <div id="app" class="hidden container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Business Manager</h1>
        <div class="flex gap-2">
          <button
            onclick="loadData()"
            class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300"
          >
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button
            onclick="openModal('new')"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
          >
            <i class="fas fa-plus"></i> Add New
          </button>
          <button
            onclick="logout()"
            class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
          >
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
      <div class="mb-6">
        <input
          type="text"
          id="search"
          onkeyup="filterGrid()"
          placeholder="Search businesses..."
          class="w-full p-3 border rounded-lg shadow-sm"
        />
      </div>
      <div
        id="businessGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto py-10"
    >
      <div
        class="bg-white rounded-lg shadow-xl w-full max-w-2xl m-4 p-6 relative"
      >
        <h2 id="modalTitle" class="text-2xl font-bold mb-4">Edit Business</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-bold mb-1">ID (URL Slug)</label>
            <input
              type="text"
              id="editId"
              required
              class="w-full p-2 border rounded bg-gray-50"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Business Name</label>
            <input
              type="text"
              id="editName"
              required
              class="w-full p-2 border rounded"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Phone</label>
            <input
              type="text"
              id="editPhone"
              class="w-full p-2 border rounded"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Email</label>
            <input
              type="email"
              id="editEmail"
              class="w-full p-2 border rounded"
            />
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-bold mb-1">Image URL</label>
            <input
              type="text"
              id="editImage"
              class="w-full p-2 border rounded"
            />
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-bold mb-1"
              >Background Gradient</label
            >
            <div class="flex gap-2">
              <input
                type="text"
                id="editGradient"
                class="w-full p-2 border rounded"
                placeholder="linear-gradient(...) or #Hex"
              />
              <input
                type="color"
                onchange="
                  document.getElementById('editGradient').value = this.value
                "
                class="h-10 w-10 cursor-pointer"
              />
            </div>
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Address Text</label>
            <input
              type="text"
              id="editAddrText"
              class="w-full p-2 border rounded"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Maps URL</label>
            <input
              type="text"
              id="editAddrUrl"
              class="w-full p-2 border rounded"
            />
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button onclick="closeEditModal()" class="px-4 py-2 text-gray-600">
            Cancel
          </button>
          <button
            onclick="saveBusiness()"
            id="saveBtn"
            class="bg-blue-600 text-white px-6 py-2 rounded"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="hidden fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded shadow-lg z-50"
    >
      Operation successful
    </div>

    <script>
      let globalData = {};
      let credentials = { url: "", key: "" };
      let currentEditId = null;

      window.onload = () => {
        const stored = localStorage.getItem("supabase_creds");
        if (stored) {
          credentials = JSON.parse(stored);
          document.getElementById("supabaseUrl").value = credentials.url;
          document.getElementById("supabaseKey").value = credentials.key;
          authenticate(); // Auto-login if creds exist
        }
      };

      function showLoginError(msg) {
        const err = document.getElementById("loginError");
        err.textContent = msg;
        err.classList.remove("hidden");
      }

      async function authenticate() {
        const btn = document.getElementById("btnAuth");
        const url = document
          .getElementById("supabaseUrl")
          .value.trim()
          .replace(/\/$/, "");
        const key = document.getElementById("supabaseKey").value.trim();

        if (!url || !key) return showLoginError("Please fill all fields");

        btn.disabled = true;
        btn.textContent = "Connecting...";

        try {
          const res = await fetch(`${url}/rest/v1/businesses?limit=1`, {
            headers: { apikey: key, Authorization: `Bearer ${key}` },
          });

          if (!res.ok) throw new Error("Invalid URL or Key");

          credentials = { url, key };
          localStorage.setItem("supabase_creds", JSON.stringify(credentials));
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          loadData();
        } catch (e) {
          showLoginError(e.message);
          btn.disabled = false;
          btn.textContent = "Connect";
        }
      }

      async function loadData() {
        showToast("Loading...");
        try {
          const res = await fetch(
            `${credentials.url}/rest/v1/businesses?select=*`,
            {
              headers: {
                apikey: credentials.key,
                Authorization: `Bearer ${credentials.key}`,
              },
            },
          );
          const businesses = await res.json();
          globalData = {};
          businesses.forEach((b) => (globalData[b.business_id] = b));
          renderGrid();
        } catch (e) {
          alert("Load failed");
        }
      }

      function renderGrid() {
        const grid = document.getElementById("businessGrid");
        grid.innerHTML = Object.entries(globalData)
          .map(
            ([id, biz]) => `
          <div class="bg-white p-4 rounded-lg shadow">
            <h3 class="font-bold">${biz.name || "Unnamed"}</h3>
            <p class="text-xs text-gray-500">${id}</p>
            <div class="mt-4 flex gap-2">
              <button onclick="editBusiness('${id}')" class="flex-1 bg-blue-50 text-blue-600 py-1 rounded">Edit</button>
              <button onclick="deleteBusiness('${id}')" class="flex-1 bg-red-50 text-red-600 py-1 rounded">Delete</button>
            </div>
          </div>
        `,
          )
          .join("");
      }

      function openModal(mode, id = null) {
        currentEditId = id;
        document.getElementById("editModal").classList.remove("hidden");
        const b = id ? globalData[id] : {};

        document.getElementById("editId").value = id || "";
        document.getElementById("editId").disabled = !!id;
        document.getElementById("editName").value = b.name || "";
        document.getElementById("editPhone").value = b.phone || "";
        document.getElementById("editEmail").value = b.email || "";
        document.getElementById("editImage").value = b.image || "";
        document.getElementById("editGradient").value = b.gradient || "";
        document.getElementById("editAddrText").value = b.address?.text || "";
        document.getElementById("editAddrUrl").value = b.address?.url || "";
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }
      window.editBusiness = (id) => openModal("edit", id);

      async function saveBusiness() {
        const id = document.getElementById("editId").value.trim().toLowerCase();
        const payload = {
          business_id: id,
          name: document.getElementById("editName").value,
          phone: document.getElementById("editPhone").value,
          email: document.getElementById("editEmail").value,
          image: document.getElementById("editImage").value,
          gradient: document.getElementById("editGradient").value,
          address: {
            text: document.getElementById("editAddrText").value,
            url: document.getElementById("editAddrUrl").value,
          },
        };

        const method = currentEditId ? "PATCH" : "POST";
        const url = currentEditId
          ? `${credentials.url}/rest/v1/businesses?business_id=eq.${id}`
          : `${credentials.url}/rest/v1/businesses`;

        await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
            apikey: credentials.key,
            Authorization: `Bearer ${credentials.key}`,
          },
          body: JSON.stringify(payload),
        });

        closeEditModal();
        loadData();
      }

      function logout() {
        localStorage.removeItem("supabase_creds");
        location.reload();
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.remove("hidden");
        setTimeout(() => t.classList.add("hidden"), 2000);
      }
    </script>
  </body>
</html>
