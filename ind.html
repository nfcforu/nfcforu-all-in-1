<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Business Card</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        background: #1e1e1e; /* Default fallback */
        color: #fff;
        line-height: 1.4;
        overflow-x: hidden;
        transition: background 0.5s ease;
      }
      .main-container {
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 20px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .profile-header {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeInUp 0.6s ease-out;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .profile-avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #fff;
        margin-bottom: 20px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
      }
      .profile-name {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      .profile-bio {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.8);
        max-width: 300px;
        margin: 0 auto;
      }
      .links-container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .link-item {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 18px;
        text-decoration: none;
        color: #fff;
        display: flex;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
        animation: fadeInUp 0.6s ease-out backwards;
      }
      .link-item:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .link-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 16px;
        font-size: 1.2rem;
        flex-shrink: 0;
      }
      .link-content {
        flex: 1;
        min-width: 0;
      }
      .link-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .link-subtitle {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .link-arrow {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.4);
      }

      /* Specific Icon Gradients */
      .link-item.address .link-icon {
        background: linear-gradient(135deg, #fd746c, #ff9068);
      }
      .link-item.phone .link-icon {
        background: linear-gradient(135deg, #11998e, #38ef7d);
      }
      .link-item.email .link-icon {
        background: linear-gradient(135deg, #5b6e7e, #8ca1b1);
      }
      .link-item.instagram .link-icon {
        background: radial-gradient(
          circle at 30% 107%,
          #fdf497 0%,
          #fdf497 5%,
          #fd5949 45%,
          #d6249f 60%,
          #285aeb 90%
        );
      }
      .link-item.facebook .link-icon {
        background: #1877f2;
      }
      .link-item.whatsapp .link-icon {
        background: #25d366;
      }
      .link-item.tiktok .link-icon {
        background: #000;
      }

      .loading-state,
      .error-state {
        text-align: center;
        padding: 100px 20px;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container" id="mainContainer"></div>

    <script>
      const SUPABASE_URL = "https://uuzgfzhfbxfxzpjumpgd.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1emdmemhmYnhmeHpwanVtcGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MDI0MjcsImV4cCI6MjA4NDQ3ODQyN30.tgYk1EFQKEujjqYlNpr2ZdgYEciFtlHV7uGj4PRqbkc";

      function getIcon(type) {
        const icons = {
          address: "fas fa-map-marker-alt",
          phone: "fas fa-phone",
          email: "fas fa-envelope",
          instagram: "fab fa-instagram",
          facebook: "fab fa-facebook",
          whatsapp: "fab fa-whatsapp",
          tiktok: "fab fa-tiktok",
          youtube: "fab fa-youtube",
          snapchat: "fab fa-snapchat-ghost",
          telegram: "fab fa-telegram",
          viber: "fab fa-viber",
          threads: "fa-brands fa-threads",
          website: "fas fa-globe",
        };
        return icons[type] || "fas fa-link";
      }

      function applyBackground(grad) {
        if (!grad) return;
        // If it's just a hex, turn it into a dark gradient
        const backgroundStyle = grad.includes("gradient")
          ? grad
          : `linear-gradient(135deg, ${grad} 0%, #111111 100%)`;
        document.body.style.background = backgroundStyle;
        document.body.style.backgroundAttachment = "fixed";
      }

      async function loadBusiness() {
        const container = document.getElementById("mainContainer");
        container.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div></div>`;

        const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        const businessId = path || "sac-de-lux";

        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/businesses?business_id=eq.${businessId}&select=*`,
            {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
            },
          );
          const data = await res.json();
          const biz = data[0];

          if (!biz) {
            container.innerHTML = `<div class="error-state"><h2>Business Not Found</h2></div>`;
            return;
          }

          // Apply settings from dashboard
          applyBackground(biz.gradient);
          document.title = biz.name;

          const links = [];

          // 1. Add Address (New Fields)
          if (biz.address && biz.address.text) {
            links.push({
              type: "address",
              title: "Notre Adresse",
              subtitle: biz.address.text,
              url: biz.address.url || "#",
            });
          }

          // 2. Add Contact Info
          if (biz.phone)
            links.push({
              type: "phone",
              title: "Appelez-nous",
              subtitle: biz.phone,
              url: `tel:${biz.phone}`,
            });
          if (biz.email)
            links.push({
              type: "email",
              title: "Envoyez-nous un email",
              subtitle: biz.email,
              url: `mailto:${biz.email}`,
            });

          // 3. Add Socials
          if (biz.socials) {
            Object.entries(biz.socials).forEach(([key, url]) => {
              if (url) {
                links.push({
                  type: key,
                  title: key.charAt(0).toUpperCase() + key.slice(1),
                  subtitle: `Suivez-nous sur ${key}`,
                  url: url,
                });
              }
            });
          }

          const linksHtml = links
            .map(
              (l, i) => `
            <a href="${l.url}" class="link-item ${l.type}" target="_blank" style="animation-delay: ${0.1 + i * 0.1}s">
              <div class="link-icon"><i class="${getIcon(l.type)}"></i></div>
              <div class="link-content">
                <div class="link-title">${l.title}</div>
                <div class="link-subtitle">${l.subtitle}</div>
              </div>
              <div class="link-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>
          `,
            )
            .join("");

          container.innerHTML = `
            <div class="profile-header">
              <img src="${biz.image || "https://via.placeholder.com/150"}" class="profile-avatar" onerror="this.src='https://via.placeholder.com/150'">
              <h1 class="profile-name">${biz.name}</h1>
              <p class="profile-bio">Connectez-vous avec nous via les liens ci-dessous</p>
            </div>
            <div class="links-container">${linksHtml}</div>
          `;
        } catch (err) {
          container.innerHTML = `<div class="error-state"><h2>Erreur de chargement</h2></div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", loadBusiness);
    </script>
  </body>
</html>
