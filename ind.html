<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chargement...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        background: #1a1a1a;
        color: white;
        font-family: "Inter", sans-serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div id="main-content" class="w-full max-w-md text-center">
      <div class="loader-container" id="loader">
        <div
          class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"
        ></div>
        <p class="mt-4 text-gray-400">Recherche de l'entreprise...</p>
      </div>
    </div>

    <script>
      // --- CONFIGURATION SUPABASE ---
      const SB_URL = "VOTRE_URL_SUPABASE";
      const SB_KEY = "VOTRE_CLE_ANON_PUBLIQUE";

      async function loadBusiness() {
        const content = document.getElementById("main-content");

        // 1. RÉCUPÉRER L'ID DEPUIS L'URL (?id=nom-entreprise)
        const urlParams = new URLSearchParams(window.location.search);
        let bizId = urlParams.get("id");

        // Si pas d'ID dans l'URL, on essaie de voir si le fichier a été renommé
        if (!bizId) {
          const path = window.location.pathname.split("/").pop();
          if (path !== "ind.html" && path !== "") {
            bizId = path.replace(".html", "");
          }
        }

        if (!bizId || bizId === "ind") {
          content.innerHTML = `<div class="p-8 glass rounded-3xl"><i class="fas fa-search text-4xl mb-4 text-red-400"></i><h1 class="text-xl font-bold">Lien invalide</h1><p class="text-gray-400 mt-2">Aucun identifiant d'entreprise détecté.</p></div>`;
          return;
        }

        try {
          const res = await fetch(
            `${SB_URL}/rest/v1/businesses?business_id=eq.${bizId}&select=*`,
            {
              headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` },
            },
          );
          const data = await res.json();

          if (!data.length) {
            content.innerHTML = `<div class="p-8 glass rounded-3xl"><h1 class="text-xl font-bold">Entreprise introuvable</h1><p class="text-gray-400 mt-2">L'entreprise "${bizId}" n'existe pas.</p></div>`;
            return;
          }

          renderProfile(data[0]);
        } catch (e) {
          content.innerHTML = `<p class="text-red-400">Erreur de connexion</p>`;
        }
      }

      function renderProfile(biz) {
        document.title = biz.name;
        const socials = biz.socials || {};
        const container = document.getElementById("main-content");

        let linksHtml = "";
        const icons = {
          facebook: "fab fa-facebook",
          instagram: "fab fa-instagram",
          tiktok: "fab fa-tiktok",
          whatsapp: "fab fa-whatsapp",
          linkedin: "fab fa-linkedin",
          twitter: "fab fa-x-twitter",
          website: "fas fa-globe",
          youtube: "fab fa-youtube",
          pinterest: "fab fa-pinterest",
        };

        Object.entries(socials).forEach(([platform, url]) => {
          if (url) {
            linksHtml += `
                        <a href="${url}" target="_blank" class="glass flex items-center p-4 rounded-2xl mb-3 hover:scale-[1.02] transition-transform">
                            <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 mr-4">
                                <i class="${icons[platform] || "fas fa-link"} text-xl"></i>
                            </div>
                            <span class="font-bold capitalize">${platform}</span>
                            <i class="fas fa-chevron-right ml-auto text-gray-500"></i>
                        </a>`;
          }
        });

        container.innerHTML = `
                <div class="mb-8">
                    <img src="${biz.image || "https://via.placeholder.com/150"}" class="w-24 h-24 rounded-full mx-auto border-4 border-blue-500/20 shadow-xl mb-4 object-cover">
                    <h1 class="text-2xl font-black">${biz.name}</h1>
                    <p class="text-gray-400 text-sm mt-1">Contactez-nous ci-dessous</p>
                </div>
                <div class="text-left">${linksHtml}</div>
            `;
      }

      loadBusiness();
    </script>
  </body>
</html>
