<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - NFC Business Manager</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 440px;
        width: 100%;
        overflow: hidden;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .login-header i {
        font-size: 3rem;
        margin-bottom: 15px;
        opacity: 0.9;
      }

      .login-header h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }

      .login-header p {
        opacity: 0.9;
        font-size: 1rem;
      }

      .login-body {
        padding: 40px 30px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #4a5568;
        font-size: 0.95rem;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #a0aec0;
        font-size: 1.1rem;
      }

      .form-group input {
        width: 100%;
        padding: 14px 14px 14px 45px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .btn-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
      }

      .alert.show {
        display: flex;
      }

      .alert-error {
        background: #fff5f5;
        color: #c53030;
        border-left: 4px solid #f56565;
      }

      .alert-success {
        background: #f0fff4;
        color: #22543d;
        border-left: 4px solid #48bb78;
      }

      .login-footer {
        text-align: center;
        padding: 0 30px 30px;
        color: #718096;
        font-size: 0.9rem;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .login-header {
          padding: 30px 20px;
        }

        .login-header h1 {
          font-size: 1.5rem;
        }

        .login-body {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <i class="fas fa-nfc-symbol"></i>
        <h1>Welcome Back!</h1>
        <p>Login to manage your business card</p>
      </div>

      <div class="login-body">
        <div id="alertBox" class="alert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="alertMessage"></span>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope"></i>
              <input
                type="email"
                id="email"
                placeholder="your@email.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span id="btnText">Login to Dashboard</span>
            <i class="fas fa-arrow-right" id="btnIcon"></i>
            <div class="spinner" id="btnSpinner" style="display: none"></div>
          </button>
        </form>
      </div>

      <div class="login-footer">
        <p>🔒 Your data is secure and encrypted</p>
      </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Config -->
    <script src="supabase-config.js"></script>

    <script>
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");
      const btnSpinner = document.getElementById("btnSpinner");
      const alertBox = document.getElementById("alertBox");
      const alertMessage = document.getElementById("alertMessage");

      // Check if already logged in
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === "SIGNED_IN" && session) {
          // Check if admin or customer
          try {
            const user = await db.getUser(session.user.id);
            if (user.role === "admin") {
              window.location.href = "/admin-dashboard.html";
            } else {
              window.location.href = "/customer-dashboard.html";
            }
          } catch (error) {
            console.error("Error checking user role:", error);
          }
        }
      });

      function showAlert(message, type = "error") {
        alertMessage.textContent = message;
        alertBox.className = `alert alert-${type} show`;
        setTimeout(() => {
          alertBox.classList.remove("show");
        }, 5000);
      }

      function setLoading(loading) {
        loginBtn.disabled = loading;
        if (loading) {
          btnText.textContent = "Logging in...";
          btnIcon.style.display = "none";
          btnSpinner.style.display = "block";
        } else {
          btnText.textContent = "Login to Dashboard";
          btnIcon.style.display = "block";
          btnSpinner.style.display = "none";
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert("Please fill in all fields");
          return;
        }

        setLoading(true);

        try {
          // Sign in
          await auth.signIn(email, password);

          // Get user role
          const currentUser = await auth.getCurrentUser();
          const userData = await db.getUser(currentUser.id);

          if (userData.role === "admin") {
            showAlert("Welcome back, Admin! Redirecting...", "success");
            setTimeout(() => {
              window.location.href = "/admin-dashboard.html";
            }, 1000);
          } else {
            showAlert("Login successful! Redirecting...", "success");
            setTimeout(() => {
              window.location.href = "/customer-dashboard.html";
            }, 1000);
          }
        } catch (error) {
          console.error("Login error:", error);

          let errorMessage = "Login failed. Please try again.";

          if (error.message.includes("Invalid login credentials")) {
            errorMessage = "Invalid email or password.";
          } else if (error.message.includes("Email not confirmed")) {
            errorMessage = "Please confirm your email first.";
          } else if (error.message.includes("User not found")) {
            errorMessage = "No account found with this email.";
          }

          showAlert(errorMessage);
          setLoading(false);
        }
      });

      // Allow Enter key to submit
      passwordInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          loginForm.dispatchEvent(new Event("submit"));
        }
      });
    </script>
  </body>
</html>
