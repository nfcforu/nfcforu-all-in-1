<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f8f8f8;
            margin: 0;
            color: #222;
        }
        .menu-container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px;
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #f8f8f8 0%, #e0e7ff 100%);
            margin: 0;
            color: #222;
        }
        .menu-container {
            max-width: 950px;
            margin: 48px auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(118,75,162,0.10);
            padding: 40px 32px;
        }
        .menu-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }
        .menu-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #764ba2;
            margin-bottom: 12px;
            letter-spacing: -1px;
            text-shadow: 0 2px 8px #764ba233;
        }
        .search-bar {
            width: 100%;
            max-width: 420px;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #c3b6e6;
            font-size: 1.08rem;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #764ba211;
            transition: border 0.2s;
        }
        .search-bar:focus {
            border: 1.5px solid #764ba2;
            outline: none;
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .category-tab {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8f8f8 100%);
            color: #764ba2;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-size: 1.08rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px #764ba211;
            transition: background 0.2s, color 0.2s;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 16px #764ba244;
        }
        .menu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
        }
        .menu-item {
            background: linear-gradient(135deg, #f4f4f4 0%, #e0e7ff 100%);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(118,75,162,0.08);
            padding: 22px 18px;
            flex: 1 1 260px;
            min-width: 220px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .menu-item:hover {
            box-shadow: 0 12px 40px #764ba244;
            transform: translateY(-6px) scale(1.04);
        }
        .menu-item-image {
            width: 100%;
            max-width: 220px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #eee;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .menu-item-image:hover {
            box-shadow: 0 8px 32px #764ba2aa;
        }
        .menu-item-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }
        .menu-item-desc {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 10px;
        }
        .menu-item-price {
            font-size: 1.12rem;
            font-weight: 700;
            color: #11998e;
            margin-bottom: 4px;
            background: #e0f7fa;
            border-radius: 8px;
            padding: 3px 10px;
            display: inline-block;
            box-shadow: 0 2px 8px #11998e22;
        }
        .menu-item-oldprice {
            font-size: 1rem;
            color: #b71c1c;
            text-decoration: line-through;
            margin-left: 10px;
        }
        .menu-item-offer {
            font-size: 1rem;
            color: #e67e22;
            background: #fffbe6;
            border-radius: 8px;
            padding: 3px 10px;
            margin-bottom: 8px;
            font-weight: 700;
            box-shadow: 0 2px 8px #e67e2222;
        }
        /* Modal for image zoom */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal-content {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 20px;
            box-shadow: 0 12px 48px #764ba2cc;
            background: #fff;
            padding: 20px;
            position: relative;
        }
        .image-modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 14px;
        }
        .image-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 2.2rem;
            color: #764ba2;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .menu-container {
                padding: 12px 4px;
            }
            .menu-list {
                gap: 14px;
            }
            .menu-title {
                font-size: 1.5rem;
            }
        }
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    activeCategory = tab.dataset.cat;
                    renderMenu(document.getElementById('searchBar').value);
                });
            });
        });
    // Search bar handler
    document.getElementById('searchBar').addEventListener('input', e => {
        renderMenu(e.target.value);
    });
    // Image modal close
    document.getElementById('imageModalClose').addEventListener('click', () => {
        document.getElementById('imageModal').classList.remove('active');
        document.getElementById('modalImage').src = '';
    });
    document.getElementById('imageModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('imageModal')) {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('modalImage').src = '';
        }
    });
    </script>
</body>
</html>
