<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .smooth-scroll {
        scroll-behavior: smooth;
      }

      /* Skeleton Animation */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f3f4f6 25%,
          #e5e7eb 50%,
          #f3f4f6 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* Mobile Optimization */
      .item-card:active {
        transform: scale(0.98);
        background-color: #f9fafb;
      }
      .category-pill.active {
        background-color: #000;
        color: #fff;
        border-color: #000;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 pb-20">
    <div
      id="loader"
      class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center"
    >
      <div
        class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin mb-4"
      ></div>
      <p class="text-gray-400 text-sm">Loading Menu...</p>
    </div>

    <div
      id="error"
      class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center"
    >
      <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
      <h2 class="text-xl font-bold mb-2">Menu Not Found</h2>
      <p class="text-gray-500">
        Please check the URL or scan the QR code again.
      </p>
    </div>

    <main id="app" class="hidden opacity-0 transition-opacity duration-500">
      <div class="relative h-48 md:h-64 w-full">
        <img id="coverImg" src="" class="w-full h-full object-cover" />
        <div
          class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"
        ></div>

        <div class="absolute bottom-4 left-4 right-4 text-white">
          <h1 id="restName" class="text-3xl font-bold mb-1 shadow-sm"></h1>
          <p id="restDesc" class="text-sm opacity-90 font-light"></p>
        </div>

        <button
          onclick="toggleInfo()"
          class="absolute top-4 right-4 bg-white/20 backdrop-blur-md p-2 rounded-full text-white hover:bg-white/30 transition"
        >
          <i class="fas fa-info-circle text-xl"></i>
        </button>
      </div>

      <div
        class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100"
      >
        <div class="px-4 py-3">
          <div class="relative">
            <i
              class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"
            ></i>
            <input
              type="text"
              id="search"
              onkeyup="filterMenu()"
              placeholder="Search food..."
              class="w-full bg-gray-100 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black/10"
            />
          </div>
        </div>

        <div
          class="flex overflow-x-auto no-scrollbar gap-2 px-4 pb-3"
          id="categoryNav"
        ></div>
      </div>

      <div
        id="menuContainer"
        class="px-4 pt-4 space-y-8 min-h-screen bg-white"
      ></div>
    </main>

    <div
      id="infoModal"
      class="fixed inset-0 bg-black/50 z-50 hidden items-end sm:items-center justify-center backdrop-blur-sm"
      onclick="toggleInfo()"
    >
      <div
        class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-6 transform transition-transform duration-300 translate-y-full sm:translate-y-0"
        id="infoContent"
        onclick="event.stopPropagation()"
      >
        <div
          class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6 sm:hidden"
        ></div>
        <h2 class="text-2xl font-bold mb-6">Restaurant Info</h2>

        <div class="space-y-4">
          <a
            id="linkMap"
            href="#"
            target="_blank"
            class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl hover:bg-gray-100"
          >
            <div
              class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"
            >
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <div>
              <div class="font-bold text-sm">Location</div>
              <div class="text-xs text-gray-500">Get Directions</div>
            </div>
          </a>

          <a
            id="linkPhone"
            href="#"
            class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl hover:bg-gray-100"
          >
            <div
              class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600"
            >
              <i class="fas fa-phone"></i>
            </div>
            <div>
              <div class="font-bold text-sm">Call Us</div>
              <div id="phoneDisplay" class="text-xs text-gray-500"></div>
            </div>
          </a>

          <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl">
            <div
              class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600"
            >
              <i class="fas fa-wifi"></i>
            </div>
            <div>
              <div class="font-bold text-sm">WiFi Password</div>
              <div id="wifiDisplay" class="text-xs text-gray-500">
                Ask waiter
              </div>
            </div>
          </div>

          <div class="flex gap-3 mt-6">
            <a
              id="socialInsta"
              href="#"
              target="_blank"
              class="flex-1 py-3 text-center bg-black text-white rounded-xl text-sm font-medium"
              >Instagram</a
            >
            <a
              id="socialFb"
              href="#"
              target="_blank"
              class="flex-1 py-3 text-center bg-blue-600 text-white rounded-xl text-sm font-medium"
              >Facebook</a
            >
          </div>
        </div>
      </div>
    </div>

    <div
      id="itemModal"
      class="fixed inset-0 bg-black/80 z-50 hidden justify-center items-center p-4 backdrop-blur-sm"
      onclick="closeItem()"
    >
      <div
        class="bg-white rounded-2xl overflow-hidden w-full max-w-sm relative shadow-2xl"
        onclick="event.stopPropagation()"
      >
        <button
          onclick="closeItem()"
          class="absolute top-3 right-3 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center z-10"
        >
          ✕
        </button>
        <img id="modalImg" src="" class="w-full h-64 object-cover" />
        <div class="p-6">
          <div class="flex justify-between items-start mb-2">
            <h3 id="modalTitle" class="text-xl font-bold leading-tight"></h3>
            <span
              id="modalPrice"
              class="bg-green-100 text-green-800 px-2 py-1 rounded text-sm font-bold whitespace-nowrap ml-2"
            ></span>
          </div>
          <p
            id="modalDesc"
            class="text-gray-500 text-sm leading-relaxed mb-6"
          ></p>
          <button
            onclick="closeItem()"
            class="w-full bg-black text-white py-3 rounded-xl font-medium"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script>
      let menuData = {};

      // 1. Get ID from URL (e.g., menu.html?id=los-tacos)
      const urlParams = new URLSearchParams(window.location.search);
      const businessId = urlParams.get("id") || "los-tacos"; // Default for testing

      async function init() {
        try {
          const res = await fetch("menus.json");
          if (!res.ok) throw new Error("JSON not found");

          const allMenus = await res.json();
          menuData = allMenus[businessId];

          if (!menuData) {
            document.getElementById("loader").classList.add("hidden");
            document.getElementById("error").classList.remove("hidden");
            return;
          }

          renderApp();
        } catch (err) {
          console.error(err);
          document.getElementById("loader").classList.add("hidden");
          document.getElementById("error").classList.remove("hidden");
        }
      }

      function renderApp() {
        // Header Info
        const info = menuData.info;
        document.getElementById("coverImg").src = info.cover;
        document.getElementById("restName").textContent = info.name;
        document.getElementById("restDesc").textContent = info.description;

        // Modal Info
        document.getElementById("phoneDisplay").textContent = info.phone;
        document.getElementById("linkPhone").href = `tel:${info.phone}`;
        document.getElementById("wifiDisplay").textContent = info.wifi || "-";
        document.getElementById("linkMap").href = info.location;

        const instaBtn = document.getElementById("socialInsta");
        if (info.instagram) instaBtn.href = info.instagram;
        else instaBtn.style.display = "none";

        const fbBtn = document.getElementById("socialFb");
        if (info.facebook) fbBtn.href = info.facebook;
        else fbBtn.style.display = "none";

        // Categories
        const nav = document.getElementById("categoryNav");
        const container = document.getElementById("menuContainer");

        // Clean containers
        nav.innerHTML = "";
        container.innerHTML = "";

        menuData.categories.forEach((cat, index) => {
          // 1. Add Pill to Nav
          const pill = document.createElement("button");
          pill.className = `category-pill px-5 py-2 rounded-full text-sm font-medium border border-gray-200 whitespace-nowrap transition ${
            index === 0 ? "active" : "bg-white text-gray-600"
          }`;
          pill.textContent = cat;
          pill.onclick = () => scrollToCategory(cat, pill);
          nav.appendChild(pill);

          // 2. Add Section to Body
          const section = document.createElement("div");
          section.id = `cat-${cat}`;
          section.className = "scroll-mt-40 mb-8"; // Offset for sticky header

          const title = document.createElement("h2");
          title.className = "text-xl font-bold mb-4";
          title.textContent = cat;
          section.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "grid gap-4";

          // Filter items for this category
          const items = menuData.items.filter((i) => i.category === cat);
          items.forEach((item) => {
            const card = document.createElement("div");
            card.className =
              "item-card flex gap-4 p-3 rounded-xl border border-gray-100 bg-white shadow-sm cursor-pointer transition";
            card.onclick = () => openItem(item);

            // Check if image exists
            const imgHtml = item.image
              ? `<img src="${item.image}" class="w-24 h-24 rounded-lg object-cover flex-shrink-0 bg-gray-100">`
              : "";

            card.innerHTML = `
                        <div class="flex-grow min-w-0 flex flex-col justify-between py-1">
                            <div>
                                <h3 class="font-bold text-gray-900 leading-tight mb-1 truncate">${item.name}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">${item.desc}</p>
                            </div>
                            <div class="font-semibold text-gray-900 mt-2">${item.price}</div>
                        </div>
                        ${imgHtml}
                    `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          container.appendChild(section);
        });

        // Reveal App
        document.getElementById("loader").classList.add("hidden");
        const app = document.getElementById("app");
        app.classList.remove("hidden");
        setTimeout(() => app.classList.remove("opacity-0"), 50);
      }

      // Navigation Logic
      function scrollToCategory(cat, btn) {
        // Update Active Pill
        document.querySelectorAll(".category-pill").forEach((el) => {
          el.classList.remove(
            "active",
            "bg-black",
            "text-white",
            "border-black"
          );
          el.classList.add("bg-white", "text-gray-600");
        });
        btn.classList.remove("bg-white", "text-gray-600");
        btn.classList.add("active");

        // Scroll
        const section = document.getElementById(`cat-${cat}`);
        if (section) {
          const headerOffset = 140;
          const elementPosition = section.getBoundingClientRect().top;
          const offsetPosition =
            elementPosition + window.pageYOffset - headerOffset;
          window.scrollTo({ top: offsetPosition, behavior: "smooth" });
        }
      }

      // Filter Logic
      function filterMenu() {
        const term = document.getElementById("search").value.toLowerCase();
        const sections = document.querySelectorAll("#menuContainer > div");

        sections.forEach((section) => {
          let hasVisibleItems = false;
          const items = section.querySelectorAll(".item-card");

          items.forEach((card) => {
            const text = card.innerText.toLowerCase();
            if (text.includes(term)) {
              card.style.display = "flex";
              hasVisibleItems = true;
            } else {
              card.style.display = "none";
            }
          });

          // Hide category title if no items match
          section.style.display = hasVisibleItems ? "block" : "none";
        });
      }

      // Info Modal
      function toggleInfo() {
        const modal = document.getElementById("infoModal");
        const content = document.getElementById("infoContent");

        if (modal.classList.contains("hidden")) {
          modal.classList.remove("hidden");
          modal.classList.add("flex");
          setTimeout(() => {
            content.classList.remove("translate-y-full");
          }, 10);
        } else {
          content.classList.add("translate-y-full");
          setTimeout(() => {
            modal.classList.add("hidden");
            modal.classList.remove("flex");
          }, 300);
        }
      }

      // Item Modal
      function openItem(item) {
        document.getElementById("modalImg").src =
          item.image || "https://via.placeholder.com/400x300?text=No+Image";
        document.getElementById("modalTitle").textContent = item.name;
        document.getElementById("modalDesc").textContent = item.desc;
        document.getElementById("modalPrice").textContent = item.price;

        const modal = document.getElementById("itemModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      function closeItem() {
        document.getElementById("itemModal").classList.add("hidden");
        document.getElementById("itemModal").classList.remove("flex");
      }

      init();
    </script>
  </body>
</html>
