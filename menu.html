    <div id="menuStatus" style="text-align:center;color:#764ba2;font-size:1.2rem;margin:24px 0;"></div>
    <div class="menu-container">
        <div class="menu-header">
            <div class="menu-title">Menu du restaurant</div>
            <input id="searchBar" class="search-bar" type="text" placeholder="Rechercher un plat...">
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
        <div id="menuContent"></div>
    </div>
    <!-- Modal pour zoomer sur l'image -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <button id="imageModalClose" class="image-modal-close" title="Fermer">&times;</button>
            <img id="modalImage" src="" alt="Zoom menu">
        </div>
    </div>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #f8f8f8 0%, #e0e7ff 100%);
            margin: 0;
            color: #222;
        }
        .menu-container {
            max-width: 950px;
            margin: 48px auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(118,75,162,0.10);
            padding: 40px 32px;
        }
        .menu-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }
        .menu-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #764ba2;
            margin-bottom: 12px;
            letter-spacing: -1px;
            text-shadow: 0 2px 8px #764ba233;
        }
        .search-bar {
            width: 100%;
            max-width: 420px;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #c3b6e6;
            font-size: 1.08rem;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #764ba211;
            transition: border 0.2s;
        }
        .search-bar:focus {
            border: 1.5px solid #764ba2;
            outline: none;
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .category-tab {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8f8f8 100%);
            color: #764ba2;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-size: 1.08rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px #764ba211;
            transition: background 0.2s, color 0.2s;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 16px #764ba244;
        }
        .menu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
        }
        .menu-item {
            background: linear-gradient(135deg, #f4f4f4 0%, #e0e7ff 100%);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(118,75,162,0.08);
            padding: 22px 18px;
            flex: 1 1 260px;
            min-width: 220px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .menu-item:hover {
            box-shadow: 0 12px 40px #764ba244;
            transform: translateY(-6px) scale(1.04);
        }
        .menu-item-image {
            width: 100%;
            max-width: 220px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #eee;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .menu-item-image:hover {
            box-shadow: 0 8px 32px #764ba2aa;
        }
        .menu-item-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }
        .menu-item-desc {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 10px;
        }
        .menu-item-price {
            font-size: 1.12rem;
            font-weight: 700;
            color: #11998e;
            margin-bottom: 4px;
            background: #e0f7fa;
            border-radius: 8px;
            padding: 3px 10px;
            display: inline-block;
            box-shadow: 0 2px 8px #11998e22;
        }
        .menu-item-oldprice {
            font-size: 1rem;
            color: #b71c1c;
            text-decoration: line-through;
            margin-left: 10px;
        }
        .menu-item-offer {
            font-size: 1rem;
            color: #e67e22;
            background: #fffbe6;
            border-radius: 8px;
            padding: 3px 10px;
            margin-bottom: 8px;
            font-weight: 700;
            box-shadow: 0 2px 8px #e67e2222;
        }
        /* Modal for image zoom */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal-content {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 20px;
            box-shadow: 0 12px 48px #764ba2cc;
            background: #fff;
            padding: 20px;
            position: relative;
        }
        .image-modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 14px;
        }
        .image-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 2.2rem;
            color: #764ba2;
            cursor: pointer;
        }
        /* Améliorations mobile */
        @media (max-width: 900px) {
            .menu-container {
                padding: 18px 6px;
                margin: 18px auto;
            }
            .menu-title {
                font-size: 2rem;
            }
        }
        @media (max-width: 600px) {
            .menu-container {
                padding: 8px 2px;
                margin: 8px auto;
                border-radius: 12px;
            }
            .menu-header {
                margin-bottom: 18px;
            }
            .menu-title {
                font-size: 1.2rem;
                margin-bottom: 8px;
            }
            .search-bar {
                font-size: 0.98rem;
                padding: 8px 10px;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .category-tabs {
                gap: 6px;
                margin-bottom: 16px;
            }
            .category-tab {
                font-size: 0.95rem;
                padding: 7px 10px;
                border-radius: 8px;
            }
            .menu-list {
                gap: 8px;
                flex-direction: column;
                align-items: stretch;
            }
            .menu-item {
                min-width: 0;
                max-width: 100%;
                padding: 12px 8px;
                border-radius: 10px;
            }
            .menu-item-image {
                max-width: 100%;
                height: 90px;
                border-radius: 8px;
                margin-bottom: 8px;
            }
            .menu-item-title {
                font-size: 1rem;
                margin-bottom: 4px;
            }
            .menu-item-desc {
                font-size: 0.92rem;
                margin-bottom: 6px;
            }
            .menu-item-price {
                font-size: 0.98rem;
                padding: 2px 7px;
                border-radius: 6px;
            }
            .menu-item-oldprice {
                font-size: 0.9rem;
                margin-left: 6px;
            }
            .menu-item-offer {
                font-size: 0.9rem;
                padding: 2px 7px;
                border-radius: 6px;
                margin-bottom: 4px;
            }
            .image-modal-content {
                max-width: 98vw;
                max-height: 70vh;
                padding: 8px;
                border-radius: 10px;
            }
            .image-modal-content img {
                max-height: 50vh;
                border-radius: 8px;
            }
            .image-modal-close {
                font-size: 1.5rem;
                top: 6px;
                right: 8px;
            }
        }
    </style>
    <script>
    // Show loading message
    document.getElementById('menuStatus').textContent = 'Loading menu...';
    // Simple CSV parser
    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        const headers = lines[0].split(',');
        return lines.slice(1).map(line => {
            const values = line.split(',');
            const obj = {};
            headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : '');
            return obj;
        });
    }

    let allItems = [];
    let categories = {};
    let activeCategory = '';

    function renderMenu(filter = '') {
        const menuContent = document.getElementById('menuContent');
        let filteredItems = allItems;
        if (filter) {
            const f = filter.toLowerCase();
            filteredItems = allItems.filter(item =>
                (item.item_name && item.item_name.toLowerCase().includes(f)) ||
                (item.description && item.description.toLowerCase().includes(f))
            );
        }
        // Group by category
        const grouped = {};
        filteredItems.forEach(item => {
            const cat = item.category || 'Other';
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(item);
        });
        // Only show active category
        const showCats = activeCategory ? [activeCategory] : Object.keys(grouped);
        menuContent.innerHTML = showCats.map(cat => `
            <div class="category">
                <div class="category-title">${cat}</div>
                <div class="menu-list">
                    ${grouped[cat].map(item => `
                        <div class="menu-item">
                            ${item.item_image ? `<img class="menu-item-image" src="${item.item_image}" alt="${item.item_name}">` : ''}
                            <div class="menu-item-title">${item.item_name}</div>
                            ${item.description ? `<div class="menu-item-desc">${item.description}</div>` : ''}
                            <div>
                                <span class="menu-item-price">${item.price ? item.price + ' DA' : ''}</span>
                                ${item.old_price && item.old_price !== item.price ? `<span class="menu-item-oldprice">${item.old_price} DA</span>` : ''}
                            </div>
                            ${item.offer_text ? `<div class="menu-item-offer">${item.offer_text}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
        // Add image zoom handlers
        document.querySelectorAll('.menu-item-image').forEach(img => {
            img.addEventListener('click', () => {
                document.getElementById('modalImage').src = img.src;
                document.getElementById('imageModal').classList.add('active');
            });
        });
    }

    // Fetch and render menu
    fetch('images/menu.csv')
        .then(res => res.text())
        .then(csv => {
            document.getElementById('menuStatus').textContent = '';
            allItems = parseCSV(csv);
            categories = {};
            allItems.forEach(item => {
                const cat = item.category || 'Other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });
            // Render category tabs
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = Object.keys(categories).map(cat => `<button class="category-tab${cat === Object.keys(categories)[0] ? ' active' : ''}" data-cat="${cat}">${cat}</button>`).join('');
            activeCategory = Object.keys(categories)[0];
            renderMenu();
            // Tab click handler
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    activeCategory = tab.dataset.cat;
                    renderMenu(document.getElementById('searchBar').value);
                });
            });
        })
        .catch(err => {
            document.getElementById('menuStatus').textContent = 'Menu could not be loaded. Please check the CSV file path or try again later.';
        });
    // Search bar handler
    document.getElementById('searchBar').addEventListener('input', e => {
        renderMenu(e.target.value);
    });
    // Image modal close
    document.getElementById('imageModalClose').addEventListener('click', () => {
        document.getElementById('imageModal').classList.remove('active');
        document.getElementById('modalImage').src = '';
    });
    document.getElementById('imageModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('imageModal')) {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('modalImage').src = '';
        }
    });
    </script>
</body>
</html>
