<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Skeleton Animation */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f3f4f6 25%,
          #e5e7eb 50%,
          #f3f4f6 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .item-card:active {
        transform: scale(0.98);
        background-color: #f9fafb;
      }
      .category-pill.active {
        background-color: #000;
        color: #fff;
        border-color: #000;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 pb-20">
    <div
      id="loader"
      class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center"
    >
      <div
        class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin mb-4"
      ></div>
      <p class="text-gray-400 text-sm">Loading Menu...</p>
    </div>

    <div
      id="error"
      class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center"
    >
      <div id="errorContent"></div>
    </div>

    <main id="app" class="hidden opacity-0 transition-opacity duration-500">
      <div class="relative h-48 md:h-64 w-full overflow-hidden">
        <div class="absolute inset-0">
          <img
            id="coverBg"
            src=""
            class="w-full h-full object-cover blur-xl scale-110 opacity-60"
          />
          <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <div
          class="absolute bottom-0 left-0 right-0 p-6 text-white flex items-end gap-4 bg-gradient-to-t from-black/80 to-transparent"
        >
          <img
            id="logoImg"
            src=""
            class="w-20 h-20 rounded-full border-4 border-white shadow-lg bg-white object-cover"
          />
          <div class="mb-1">
            <h1
              id="restName"
              class="text-2xl font-bold shadow-sm leading-tight"
            ></h1>
            <p
              id="restPhone"
              class="text-sm opacity-90 font-light flex items-center gap-2 mt-1"
            >
              <i class="fas fa-phone"></i> <span></span>
            </p>
          </div>
        </div>

        <button
          onclick="toggleInfo()"
          class="absolute top-4 right-4 bg-white/20 backdrop-blur-md p-2 rounded-full text-white hover:bg-white/30 transition"
        >
          <i class="fas fa-info-circle text-xl"></i>
        </button>
      </div>

      <div
        class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100"
      >
        <div class="px-4 py-3">
          <div class="relative">
            <i
              class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"
            ></i>
            <input
              type="text"
              id="search"
              onkeyup="filterMenu()"
              placeholder="Search food..."
              class="w-full bg-gray-100 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black/10"
            />
          </div>
        </div>

        <div
          class="flex overflow-x-auto no-scrollbar gap-2 px-4 pb-3"
          id="categoryNav"
        ></div>
      </div>

      <div
        id="menuContainer"
        class="px-4 pt-4 space-y-8 min-h-screen bg-white"
      ></div>
    </main>

    <div
      id="infoModal"
      class="fixed inset-0 bg-black/50 z-50 hidden items-end sm:items-center justify-center backdrop-blur-sm"
      onclick="toggleInfo()"
    >
      <div
        class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-6 transform transition-transform duration-300 translate-y-full sm:translate-y-0"
        id="infoContent"
        onclick="event.stopPropagation()"
      >
        <div
          class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6 sm:hidden"
        ></div>
        <h2 class="text-2xl font-bold mb-6">Contact Info</h2>

        <div class="space-y-4">
          <a
            id="linkMap"
            href="#"
            target="_blank"
            class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl hover:bg-gray-100"
          >
            <div
              class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"
            >
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <div>
              <div class="font-bold text-sm">Location</div>
              <div id="addressDisplay" class="text-xs text-gray-500">
                Get Directions
              </div>
            </div>
          </a>

          <a
            id="linkPhone"
            href="#"
            class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl hover:bg-gray-100"
          >
            <div
              class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600"
            >
              <i class="fas fa-phone"></i>
            </div>
            <div>
              <div class="font-bold text-sm">Call Us</div>
              <div id="phoneDisplayModal" class="text-xs text-gray-500"></div>
            </div>
          </a>

          <div
            class="flex gap-3 mt-6 flex-wrap"
            id="socialLinksContainer"
          ></div>
        </div>
      </div>
    </div>

    <div
      id="itemModal"
      class="fixed inset-0 bg-black/80 z-50 hidden justify-center items-center p-4 backdrop-blur-sm"
      onclick="closeItem()"
    >
      <div
        class="bg-white rounded-2xl overflow-hidden w-full max-w-sm relative shadow-2xl"
        onclick="event.stopPropagation()"
      >
        <button
          onclick="closeItem()"
          class="absolute top-3 right-3 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center z-10"
        >
          ✕
        </button>
        <img
          id="modalImg"
          src=""
          class="w-full h-64 object-cover bg-gray-100"
        />
        <div class="p-6">
          <div class="flex justify-between items-start mb-2">
            <h3 id="modalTitle" class="text-xl font-bold leading-tight"></h3>
            <span
              id="modalPrice"
              class="bg-green-100 text-green-800 px-2 py-1 rounded text-sm font-bold whitespace-nowrap ml-2"
            ></span>
          </div>
          <p
            id="modalDesc"
            class="text-gray-500 text-sm leading-relaxed mb-6"
          ></p>
          <button
            onclick="closeItem()"
            class="w-full bg-black text-white py-3 rounded-xl font-medium"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script>
      // --- CSV PARSER ---
      // Simple parser that handles basic CSV structure
      function parseCSV(str) {
        const arr = [];
        let quote = false; // 'true' means we're inside a quoted field

        // Iterate over each character, keep track of current row and col (index)
        for (let row = 0, col = 0, c = 0; c < str.length; c++) {
          let cc = str[c],
            nc = str[c + 1]; // Current character, next character
          arr[row] = arr[row] || []; // Create a new row if necessary
          arr[row][col] = arr[row][col] || ""; // Create a new column (start with empty string) if necessary

          // If the current character is a quotation mark, and we're inside a
          // quoted field, and the next character is also a quotation mark,
          // add a quotation mark to the current column and skip the next character
          if (cc == '"' && quote && nc == '"') {
            arr[row][col] += cc;
            ++c;
          }

          // If it's just one quotation mark, begin/end quoted field
          else if (cc == '"') {
            quote = !quote;
          }

          // If it's a comma and we're not in a quoted field, move on to the next column
          else if (cc == "," && !quote) {
            ++col;
          }

          // If it's a newline (CRLF) and we're not in a quoted field, skip the next character
          // and move on to the next row and move to column 0 of that new row
          else if (cc == "\r" && nc == "\n" && !quote) {
            ++row;
            col = 0;
            ++c;
          }

          // If it's a newline (LF or CR) and we're not in a quoted field,
          // move on to the next row and move to column 0 of that new row
          else if ((cc == "\n" || cc == "\r") && !quote) {
            ++row;
            col = 0;
          }

          // Otherwise, push the current character to the current column
          else {
            arr[row][col] += cc;
          }
        }
        return arr;
      }

      async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const businessId = urlParams.get("id") || "los-tacos";

        try {
          // 1. Fetch Business Info (JSON)
          const resBiz = await fetch("/businesses.json");
          if (!resBiz.ok) throw new Error("Could not load businesses.json");
          const bizDataAll = await resBiz.json();
          const bizInfo = bizDataAll[businessId];

          if (!bizInfo)
            throw new Error(
              `Business ID "${businessId}" not found in businesses.json`
            );

          // 2. Fetch Menu Items (CSV)
          const resMenu = await fetch("/menus.csv");
          if (!resMenu.ok) throw new Error("Could not load menus.csv");
          const csvText = await resMenu.text();

          // Parse CSV
          const rows = parseCSV(csvText);
          // Assume Row 0 is headers: id, category, name, price, description, image
          // We'll verify headers or just assume standard order if headers match roughly

          const menuItems = [];
          // Start at index 1 to skip headers
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 3) continue; // Skip empty rows

            // Column mapping: 0=id, 1=category, 2=name, 3=price, 4=desc, 5=image
            if (row[0].trim() === businessId) {
              menuItems.push({
                category: row[1],
                name: row[2],
                price: row[3],
                desc: row[4],
                image: row[5],
              });
            }
          }

          renderApp(bizInfo, menuItems);
        } catch (err) {
          console.error(err);
          document.getElementById("loader").classList.add("hidden");
          document.getElementById("error").classList.remove("hidden");
          document.getElementById("errorContent").innerHTML = `
                    <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
                    <h2 class="text-xl font-bold mb-2">Error Loading Menu</h2>
                    <p class="text-gray-500 text-sm">${err.message}</p>
                `;
        }
      }

      function renderApp(info, items) {
        // --- 1. Render Header (From JSON) ---
        document.getElementById("restName").textContent = info.name;

        // Use Logo as Main Image and Background
        const logoUrl = info.image || "https://via.placeholder.com/150";
        document.getElementById("logoImg").src = logoUrl;
        document.getElementById("coverBg").src = logoUrl; // Blurry background

        document.getElementById("restPhone").querySelector("span").textContent =
          info.phone || "";

        // Modal Data
        if (info.phone)
          document.getElementById("linkPhone").href = `tel:${info.phone}`;
        document.getElementById("phoneDisplayModal").textContent =
          info.phone || "";

        if (info.address) {
          const addrText =
            typeof info.address === "string" ? info.address : info.address.text;
          const addrUrl =
            typeof info.address === "string" ? "#" : info.address.url;
          document.getElementById("addressDisplay").textContent = addrText;
          document.getElementById("linkMap").href = addrUrl;
        }

        // Socials
        const socialContainer = document.getElementById("socialLinksContainer");
        if (info.socials) {
          Object.entries(info.socials).forEach(([key, url]) => {
            const btn = document.createElement("a");
            btn.href = url;
            btn.target = "_blank";
            btn.className =
              "flex-1 py-3 text-center bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl text-sm font-medium capitalize transition";
            btn.innerText = key;
            socialContainer.appendChild(btn);
          });
        }

        // --- 2. Render Menu (From CSV) ---
        const nav = document.getElementById("categoryNav");
        const container = document.getElementById("menuContainer");

        // Get unique categories
        const categories = [...new Set(items.map((i) => i.category))];

        categories.forEach((cat, index) => {
          // Nav Pill
          const pill = document.createElement("button");
          pill.className = `category-pill px-5 py-2 rounded-full text-sm font-medium border border-gray-200 whitespace-nowrap transition ${
            index === 0 ? "active" : "bg-white text-gray-600"
          }`;
          pill.textContent = cat;
          pill.onclick = () => scrollToCategory(cat, pill);
          nav.appendChild(pill);

          // Section
          const section = document.createElement("div");
          section.id = `cat-${cat.replace(/\s+/g, "-")}`; // Safe ID
          section.className = "scroll-mt-40 mb-8";

          const title = document.createElement("h2");
          title.className = "text-xl font-bold mb-4";
          title.textContent = cat;
          section.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "grid gap-4";

          // Items in this category
          const catItems = items.filter((i) => i.category === cat);
          catItems.forEach((item) => {
            const card = document.createElement("div");
            card.className =
              "item-card flex gap-4 p-3 rounded-xl border border-gray-100 bg-white shadow-sm cursor-pointer transition";
            card.onclick = () => openItem(item);

            const imgHtml =
              item.image && item.image.trim() !== ""
                ? `<img src="${item.image}" class="w-24 h-24 rounded-lg object-cover flex-shrink-0 bg-gray-100">`
                : "";

            card.innerHTML = `
                        <div class="flex-grow min-w-0 flex flex-col justify-between py-1">
                            <div>
                                <h3 class="font-bold text-gray-900 leading-tight mb-1 truncate">${item.name}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">${item.desc}</p>
                            </div>
                            <div class="font-semibold text-gray-900 mt-2">${item.price}</div>
                        </div>
                        ${imgHtml}
                    `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          container.appendChild(section);
        });

        // Show UI
        document.getElementById("loader").classList.add("hidden");
        const app = document.getElementById("app");
        app.classList.remove("hidden");
        setTimeout(() => app.classList.remove("opacity-0"), 50);
      }

      // --- Helpers ---
      function scrollToCategory(cat, btn) {
        document.querySelectorAll(".category-pill").forEach((el) => {
          el.classList.remove(
            "active",
            "bg-black",
            "text-white",
            "border-black"
          );
          el.classList.add("bg-white", "text-gray-600");
        });
        btn.classList.remove("bg-white", "text-gray-600");
        btn.classList.add("active");

        const safeId = `cat-${cat.replace(/\s+/g, "-")}`;
        const section = document.getElementById(safeId);
        if (section) {
          const headerOffset = 140;
          const elementPosition = section.getBoundingClientRect().top;
          const offsetPosition =
            elementPosition + window.pageYOffset - headerOffset;
          window.scrollTo({ top: offsetPosition, behavior: "smooth" });
        }
      }

      function filterMenu() {
        const term = document.getElementById("search").value.toLowerCase();
        const sections = document.querySelectorAll("#menuContainer > div");
        sections.forEach((section) => {
          let hasVisibleItems = false;
          const items = section.querySelectorAll(".item-card");
          items.forEach((card) => {
            const text = card.innerText.toLowerCase();
            if (text.includes(term)) {
              card.style.display = "flex";
              hasVisibleItems = true;
            } else {
              card.style.display = "none";
            }
          });
          section.style.display = hasVisibleItems ? "block" : "none";
        });
      }

      function toggleInfo() {
        const modal = document.getElementById("infoModal");
        const content = document.getElementById("infoContent");
        if (modal.classList.contains("hidden")) {
          modal.classList.remove("hidden");
          modal.classList.add("flex");
          setTimeout(() => content.classList.remove("translate-y-full"), 10);
        } else {
          content.classList.add("translate-y-full");
          setTimeout(() => {
            modal.classList.add("hidden");
            modal.classList.remove("flex");
          }, 300);
        }
      }

      function openItem(item) {
        document.getElementById("modalImg").src =
          item.image && item.image.trim() !== ""
            ? item.image
            : "https://via.placeholder.com/400x300?text=No+Image";
        document.getElementById("modalTitle").textContent = item.name;
        document.getElementById("modalDesc").textContent = item.desc;
        document.getElementById("modalPrice").textContent = item.price;
        const modal = document.getElementById("itemModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      function closeItem() {
        document.getElementById("itemModal").classList.add("hidden");
        document.getElementById("itemModal").classList.remove("flex");
      }

      init();
    </script>
  </body>
</html>
