<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 min-h-screen font-sans">
    <div class="max-w-md mx-auto px-4 py-10" id="portalApp">
      <div
        id="loginSection"
        class="bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100"
      >
        <div
          class="w-20 h-20 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-lg"
        >
          <i class="fas fa-fingerprint"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 mb-2">Client Portal</h1>
        <p class="text-slate-500 text-sm mb-8">Manage your NFC business card</p>

        <div class="space-y-4 text-left">
          <div>
            <label class="text-xs font-bold uppercase text-slate-400 ml-1"
              >Business ID</label
            >
            <input
              type="text"
              id="loginId"
              class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1 focus:ring-2 focus:ring-indigo-500"
              placeholder="my-business-id"
            />
          </div>
          <div>
            <label class="text-xs font-bold uppercase text-slate-400 ml-1"
              >Access Code</label
            >
            <input
              type="password"
              id="loginCode"
              class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1 focus:ring-2 focus:ring-indigo-500"
              placeholder="••••••••"
            />
          </div>
          <button
            onclick="portalLogin()"
            id="loginBtn"
            class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg shadow-indigo-200 shadow-xl hover:bg-indigo-700 transition-all"
          >
            Login
          </button>
        </div>
      </div>

      <div id="dashSection" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-2xl font-black text-slate-800" id="bizTitle">
            Welcome
          </h2>
          <button
            onclick="location.reload()"
            class="text-red-500 font-bold text-sm"
          >
            Logout
          </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <h3 class="font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-edit text-indigo-500"></i> Edit Profile
          </h3>
          <button
            class="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 font-medium hover:border-indigo-300 hover:text-indigo-500 transition"
          >
            Update Business Info
          </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <h3 class="font-bold mb-1 flex items-center gap-2">
            <i class="fas fa-shield-halved text-orange-500"></i> Security
          </h3>
          <p class="text-xs text-slate-400 mb-4">
            Change your access code here.
          </p>

          <input
            type="text"
            id="newCode"
            class="w-full p-4 bg-slate-50 rounded-2xl mb-3 border-none focus:ring-2 focus:ring-orange-500"
            placeholder="Enter new code"
          />
          <button
            onclick="updateSecurity()"
            class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold"
          >
            Update Code
          </button>
        </div>
      </div>
    </div>

    <script>
      // REPLACE THESE with your actual Supabase URL and PUBLIC Key (anon key)
      const URL = "YOUR_SUPABASE_URL";
      const KEY = "YOUR_SUPABASE_ANON_KEY";

      let sessionID = "";

      async function portalLogin() {
        const id = document.getElementById("loginId").value.trim();
        const code = document.getElementById("loginCode").value.trim();
        const btn = document.getElementById("loginBtn");

        if (!id || !code) return alert("Please fill fields");
        btn.textContent = "Verifying...";

        try {
          // In a real app, you'd fetch the hash and compare.
          // For this project, we check business_access table.
          const hash = await hashString(code);
          const res = await fetch(
            `${URL}/rest/v1/business_access?business_id=eq.${id}&access_code_hash=eq.${hash}`,
            {
              headers: { apikey: KEY, Authorization: `Bearer ${KEY}` },
            },
          );
          const data = await res.json();

          if (data.length > 0) {
            sessionID = id;
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashSection").classList.remove("hidden");
            document.getElementById("bizTitle").textContent = id;
          } else {
            alert("Invalid ID or Code");
          }
        } catch (e) {
          alert("Login Error");
        }
        btn.textContent = "Login";
      }

      async function updateSecurity() {
        const newCode = document.getElementById("newCode").value.trim();
        if (newCode.length < 4) return alert("Code too short");

        const hash = await hashString(newCode);
        try {
          const res = await fetch(
            `${URL}/rest/v1/business_access?business_id=eq.${sessionID}`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                apikey: KEY,
                Authorization: `Bearer ${KEY}`,
              },
              body: JSON.stringify({
                access_code_hash: hash,
                access_code_raw: newCode,
              }),
            },
          );
          if (res.ok) {
            alert("Code updated! Please use this new code next time.");
            document.getElementById("newCode").value = "";
          }
        } catch (e) {
          alert("Update failed");
        }
      }

      async function hashString(str) {
        const msgUint8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
        return Array.from(new Uint8Array(hashBuffer))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
    </script>
  </body>
</html>
