<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réservation Clinique</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #2563eb;
        --secondary-color: #1e40af;
        --text-color: #1f2937;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --success-color: #10b981;
        --error-color: #ef4444;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 480px;
        width: 100%;
        padding: 40px 30px;
      }

      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo-container {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .logo-placeholder {
        font-size: 48px;
        color: white;
      }

      .clinic-name {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 8px;
      }

      .clinic-subtitle {
        font-size: 14px;
        color: #6b7280;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-color);
      }

      input,
      select {
        width: 100%;
        padding: 14px 16px;
        font-size: 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        background: white;
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        background: var(--primary-color);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background: var(--secondary-color);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
      }

      .message {
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        display: none;
      }

      .message.success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #10b981;
      }

      .message.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #ef4444;
      }

      .message.show {
        display: block;
      }

      @media (max-width: 480px) {
        .container {
          padding: 30px 20px;
        }

        .clinic-name {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo-container">
          <img
            id="clinicLogo"
            src=""
            alt="Logo Clinique"
            style="display: none"
          />
          <div class="logo-placeholder" id="logoPlaceholder">🏥</div>
        </div>
        <h1 class="clinic-name" id="clinicName">Clinique Médicale</h1>
        <p class="clinic-subtitle" id="clinicSubtitle">
          Réservez votre rendez-vous
        </p>
      </div>

      <div id="messageBox" class="message"></div>

      <form id="reservationForm">
        <div class="form-group">
          <label for="date">Date du rendez-vous</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <label for="name">Nom complet</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Entrez votre nom complet"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Numéro de téléphone</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Entrez votre numéro de téléphone"
            required
          />
        </div>

        <div class="form-group">
          <label for="age">Âge</label>
          <input
            type="number"
            id="age"
            name="age"
            placeholder="Entrez votre âge"
            min="1"
            max="150"
            required
          />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Confirmer la réservation
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // ============================================
      // CONFIGURATION SUPABASE
      // ============================================
      const SUPABASE_URL = "https://xgahasrfktpyldjkndhh.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnYWhhc3Jma3RweWxkamtuZGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MDMyMzgsImV4cCI6MjA4MjQ3OTIzOH0.0Oec4OpBjHS5OL6QMY3bvs3jT2KGfkvECgGKZfNLXb4";

      // Initialiser le client Supabase
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      // ============================================
      // CONFIGURATION DE LA MARQUE
      // ============================================
      const clinicConfig = {
        name: "Clinique Médicale",
        subtitle: "Réservez votre rendez-vous",
        primaryColor: "#2563eb",
        secondaryColor: "#1e40af",
        logoUrl: "", // Ajoutez l'URL du logo ici: 'https://example.com/logo.png'
      };

      // Appliquer la marque
      function applyBranding() {
        document.getElementById("clinicName").textContent = clinicConfig.name;
        document.getElementById("clinicSubtitle").textContent =
          clinicConfig.subtitle;

        document.documentElement.style.setProperty(
          "--primary-color",
          clinicConfig.primaryColor
        );
        document.documentElement.style.setProperty(
          "--secondary-color",
          clinicConfig.secondaryColor
        );

        if (clinicConfig.logoUrl) {
          const logoImg = document.getElementById("clinicLogo");
          logoImg.src = clinicConfig.logoUrl;
          logoImg.style.display = "block";
          document.getElementById("logoPlaceholder").style.display = "none";
        }
      }

      // Définir la date minimale à aujourd'hui
      function setMinDate() {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("date").min = today;
        document.getElementById("date").value = today;
      }

      // Afficher le message
      function showMessage(text, type) {
        const msgBox = document.getElementById("messageBox");
        msgBox.textContent = text;
        msgBox.className = `message ${type} show`;

        setTimeout(() => {
          msgBox.classList.remove("show");
        }, 5000);
      }

      // Gérer la soumission du formulaire
      document
        .getElementById("reservationForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.textContent = "Envoi en cours...";

          const formData = {
            date: document.getElementById("date").value,
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            age: parseInt(document.getElementById("age").value),
          };

          try {
            // Insérer les données dans Supabase
            const { data, error } = await supabaseClient
              .from("reservations")
              .insert([formData]);

            if (error) throw error;

            showMessage("Réservation confirmée avec succès ! ✓", "success");
            document.getElementById("reservationForm").reset();
            setMinDate();
          } catch (error) {
            showMessage(
              "Échec de la soumission de la réservation. Veuillez réessayer.",
              "error"
            );
            console.error("Erreur:", error);
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Confirmer la réservation";
          }
        });

      // Initialiser
      applyBranding();
      setMinDate();
    </script>
  </body>
</html>
