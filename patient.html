<!DOCTYPE html>
<html>
  <head>
    <title>Clinic Check-in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
      }
      #msg {
        margin-top: 20px;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Clinic Digital Queue</h2>
    <p>Enter your name to join the list:</p>
    <input type="text" id="name" placeholder="Full Name" required />
    <button onclick="submitName()">Join Waiting List</button>
    <div id="msg"></div>

    <script>
      async function submitName() {
        const name = document.getElementById("name").value;
        if (!name) return alert("Please enter your name");

        const response = await fetch("/api/queue", {
          method: "POST",
          body: JSON.stringify({ name, time: new Date().toLocaleTimeString() }),
        });

        if (response.ok) {
          document.getElementById("msg").innerText = "Added successfully!";
          document.getElementById("name").value = "";
        }
      }
    </script>
  </body>
</html>
