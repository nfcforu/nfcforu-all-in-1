<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin - Gestion des Cliniques</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        color: white;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: #10b981;
        color: white;
      }

      .btn-primary:hover {
        background: #059669;
        transform: translateY(-2px);
      }

      /* Clinics Grid */
      .clinics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
      }

      .clinic-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .clinic-card h3 {
        margin-bottom: 15px;
        color: #1f2937;
        border-bottom: 2px solid #f3f4f6;
        padding-bottom: 10px;
      }

      .clinic-info {
        margin-bottom: 20px;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .clinic-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .action-btn {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        text-decoration: none;
        text-align: center;
        flex: 1;
        min-width: 120px;
        border: 1px solid #e5e7eb;
        cursor: pointer;
        background: white;
        transition: 0.2s;
      }

      .view-patient {
        background: #eff6ff;
        color: #2563eb;
        border-color: #bfdbfe;
      }
      .view-nurse {
        background: #f0fdf4;
        color: #16a34a;
        border-color: #bbf7d0;
      }
      .btn-delete {
        background: #fef2f2;
        color: #dc2626;
        border-color: #fecaca;
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 100%;
        max-width: 500px;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Gestion des Cliniques</h1>
        <button class="btn btn-primary" onclick="openModal()">
          + Nouvelle Clinique
        </button>
      </header>

      <div id="clinicsGrid" class="clinics-grid"></div>
    </div>

    <div id="clinicModal" class="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Ajouter une Clinique</h2>
        <form id="clinicForm">
          <input type="hidden" id="clinicId" />
          <div class="form-group">
            <label>Nom de la clinique</label>
            <input type="text" id="clinicName" required />
          </div>
          <div class="form-group">
            <label>Couleur Primaire (Hex: #000000)</label>
            <input type="text" id="clinicColor" value="#2563eb" required />
          </div>
          <div style="display: flex; gap: 10px; margin-top: 20px">
            <button type="submit" class="btn btn-primary" style="flex: 1">
              Enregistrer
            </button>
            <button
              type="button"
              class="btn"
              style="background: #e5e7eb"
              onclick="closeModal()"
            >
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // SUPABASE CONFIGURATION
      const SUPABASE_URL = "YOUR_SUPABASE_URL";
      const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
      const supabaseAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // DOM Elements
      const clinicsGrid = document.getElementById("clinicsGrid");
      const clinicModal = document.getElementById("clinicModal");
      const clinicForm = document.getElementById("clinicForm");

      // Load Clinics
      async function loadClinics() {
        const { data: clinics, error } = await supabaseAdmin
          .from("clinics")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          console.error("Error:", error);
          return;
        }

        clinicsGrid.innerHTML = clinics
          .map((clinic) => {
            // Logic to generate correct URLs based on current location
            const baseUrl = window.location.href.substring(
              0,
              window.location.href.lastIndexOf("/") + 1
            );
            const patientUrl = `${baseUrl}patient.html?clinic=${clinic.id}`;
            const nurseUrl = `${baseUrl}nurse.html?clinic=${clinic.id}`;

            return `
            <div class="clinic-card">
              <h3>${clinic.name}</h3>
              <div class="clinic-info">
                <p><strong>ID:</strong> ${clinic.id}</p>
                <p><strong>Couleur:</strong> <span style="color:${clinic.primary_color}">${clinic.primary_color}</span></p>
              </div>
              <div class="clinic-actions">
                <button class="action-btn view-patient" onclick="window.open('${patientUrl}', '_blank')">🔗 Lien Patient (NFC)</button>
                <button class="action-btn view-nurse" onclick="window.open('${nurseUrl}', '_blank')">📊 Dashboard Clinique</button>
                <button class="action-btn btn-delete" onclick="deleteClinic('${clinic.id}')">Supprimer</button>
              </div>
            </div>
          `;
          })
          .join("");
      }

      // Handle Form Submit
      clinicForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("clinicId").value;
        const name = document.getElementById("clinicName").value;
        const color = document.getElementById("clinicColor").value;

        const clinicData = {
          name,
          primary_color: color,
          slug: name.toLowerCase().replace(/ /g, "-"),
        };

        try {
          if (id) {
            await supabaseAdmin.from("clinics").update(clinicData).eq("id", id);
          } else {
            const { data, error } = await supabaseAdmin
              .from("clinics")
              .insert([clinicData])
              .select();
            if (error) throw error;

            const newId = data[0].id;
            const baseUrl = window.location.href.substring(
              0,
              window.location.href.lastIndexOf("/") + 1
            );
            alert(
              `Succès!\n\nURL Patient (NFC): ${baseUrl}patient.html?clinic=${newId}\n\nURL Nurse: ${baseUrl}nurse.html?clinic=${newId}`
            );
          }
          closeModal();
          loadClinics();
        } catch (err) {
          alert("Erreur: " + err.message);
        }
      });

      async function deleteClinic(id) {
        if (confirm("Supprimer cette clinique et toutes ses données ?")) {
          await supabaseAdmin.from("clinics").delete().eq("id", id);
          loadClinics();
        }
      }

      function openModal() {
        clinicForm.reset();
        document.getElementById("clinicId").value = "";
        clinicModal.style.display = "flex";
      }

      function closeModal() {
        clinicModal.style.display = "none";
      }

      // Initial Load
      loadClinics();
    </script>
  </body>
</html>
